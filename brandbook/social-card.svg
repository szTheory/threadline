<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Threadline social preview card</title>
  <desc id="desc">A social card for Threadline showing a connected audit timeline.</desc>
  <defs>
    <linearGradient id="card-thread" x1="122" y1="459" x2="1052" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F8CFF"/>
      <stop offset=".6" stop-color="#4EDFD1"/>
      <stop offset="1" stop-color="#8A7CFF"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#141B2D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#card-bg)"/>
  <g opacity=".16" stroke="#D7DEEA" stroke-width="1">
