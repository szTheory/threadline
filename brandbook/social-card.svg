  <text x="96" y="162" fill="#D7DEEA" font-family="Geist, Inter, system-ui, sans-serif" font-size="78" font-weight="600">Threadline</text>
  <text x="102" y="220" fill="#4EDFD1" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" font-weight="500" letter-spacing="5">FOLLOW WHAT HAPPENED</text>
