<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Threadline component specimen</title>
  <desc id="desc">Buttons, callouts, cards, badges, and code blocks using brand tokens.</desc>
  <rect width="960" height="560" fill="#0B1020"/>
  <text x="48" y="64" fill="#D7DEEA" font-family="Geist, Inter, system-ui, sans-serif" font-size="30" font-weight="600">Component primitives</text>
  <g transform="translate(48 108)">
    <rect width="190" height="44" rx="6" fill="#4F8CFF"/><text x="24" y="28" fill="#08101F" font-family="Geist, Inter, system-ui, sans-serif" font-size="15" font-weight="600">Read the docs</text>
    <rect x="210" width="190" height="44" rx="6" fill="#141B2D" stroke="#2E3D5C"/><text x="234" y="28" fill="#D7DEEA" font-family="Geist, Inter, system-ui, sans-serif" font-size="15" font-weight="600">View on GitHub</text>
    <rect x="420" width="96" height="28" rx="14" fill="rgba(78,223,209,.12)" stroke="rgba(78,223,209,.3)"/><text x="438" y="19" fill="#5AE0A2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">proven</text>
  </g>
  <g transform="translate(48 196)">
    <rect width="400" height="116" rx="8" fill="#141B2D" stroke="#23304A"/>
    <text x="24" y="36" fill="#D7DEEA" font-family="Geist, Inter, system-ui, sans-serif" font-size="18" font-weight="600">Context-rich history</text>
    <text x="24" y="66" fill="#A3AFC2" font-family="Geist, Inter, system-ui, sans-serif" font-size="15">Connect changes to actor, action,</text>
    <text x="24" y="88" fill="#A3AFC2" font-family="Geist, Inter, system-ui, sans-serif" font-size="15">request, job, and transaction.</text>
    <path d="M24 100H376" stroke="#23304A"/>
  </g>
  <g transform="translate(488 196)">
    <rect width="400" height="116" rx="8" fill="rgba(79,140,255,.16)" stroke="rgba(127,169,255,.44)"/>
    <text x="24" y="38" fill="#9AB9FF" font-family="Geist, Inter, system-ui, sans-serif" font-size="16" font-weight="600">Coverage needs attention</text>
    <text x="24" y="68" fill="#D7DEEA" font-family="Geist, Inter, system-ui, sans-serif" font-size="15">Three expected tables are missing</text>
    <text x="24" y="90" fill="#D7DEEA" font-family="Geist, Inter, system-ui, sans-serif" font-size="15">deployed triggers. Rerun the generator.</text>
  </g>
  <g transform="translate(48 356)">
    <rect width="840" height="144" rx="8" fill="#080D1B" stroke="#23304A"/>
    <text x="24" y="38" fill="#4EDFD1" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">$ mix threadline.health.coverage</text>
    <text x="24" y="72" fill="#D7DEEA" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">covered: posts, users</text>
    <text x="24" y="104" fill="#FFD166" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">missing: ticket_replies</text>
  </g>
</svg>
