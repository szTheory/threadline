<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Terminal snippet style</title>
  <desc id="desc">A Threadline terminal screenshot style for docs and launch material.</desc>
  <rect width="960" height="420" fill="#0B1020"/>
  <rect x="56" y="54" width="848" height="312" rx="8" fill="#080D1B" stroke="#23304A"/>
  <circle cx="84" cy="82" r="5" fill="#F06A6A"/><circle cx="104" cy="82" r="5" fill="#F3B94C"/><circle cx="124" cy="82" r="5" fill="#3FD08F"/>
  <text x="56" y="34" fill="#8F9DB5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="2">TERMINAL / COPYABLE / LOW DRAMA</text>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">
    <text x="86" y="132" fill="#4EDFD1">$ mix threadline.gen.triggers --tables posts</text>
    <text x="86" y="172" fill="#D7DEEA">Generated migration for posts audit capture.</text>
    <text x="86" y="212" fill="#4EDFD1">$ mix threadline.health.coverage</text>
    <text x="86" y="252" fill="#5AE0A2">covered: posts</text>
    <text x="86" y="292" fill="#8F9DB5">next: run mix ecto.migrate in the host app</text>
  </g>
</svg>
