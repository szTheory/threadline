<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">README header mock</title>
  <desc id="desc">A restrained README header for Threadline.</desc>
  <rect width="960" height="420" fill="#F7F9FC"/>
  <rect x="48" y="48" width="864" height="324" rx="8" fill="#FFFFFF" stroke="#C9D3E2"/>
