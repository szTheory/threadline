<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Docs page mock</title>
  <desc id="desc">A documentation page layout for Threadline.</desc>
  <rect width="1120" height="760" fill="#F7F9FC"/>
  <rect x="0" y="0" width="264" height="760" fill="#FFFFFF"/>
  <path d="M264 0V760" stroke="#C9D3E2"/>
  <image href="../logo-monochrome.svg" x="32" y="30" width="190" height="56"/>
  <g font-family="Geist, Inter, system-ui, sans-serif" font-size="15">
    <text x="34" y="132" fill="#0F1728" font-weight="600">Start here</text>
    <text x="34" y="174" fill="#3B4762">Getting started</text>
    <text x="34" y="214" fill="#3B4762">How Threadline works</text>
    <text x="34" y="254" fill="#1557C0">Operator surface</text>
    <text x="34" y="294" fill="#3B4762">Integration contracts</text>
  </g>
  <text x="328" y="106" fill="#0F1728" font-family="Geist, Inter, system-ui, sans-serif" font-size="42" font-weight="600">Operator surface</text>
  <text x="328" y="150" fill="#3B4762" font-family="Geist, Inter, system-ui, sans-serif" font-size="18">Mount a fail-closed audit console inside your Phoenix app.</text>
  <rect x="328" y="204" width="704" height="168" rx="8" fill="#0B1020"/>
  <text x="360" y="250" fill="#4EDFD1" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">scope "/audit", MyAppWeb do</text>
  <text x="360" y="284" fill="#D7DEEA" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">  pipe_through [:browser, :require_authenticated_admin]</text>
  <text x="360" y="318" fill="#D7DEEA" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">  threadline_operator_surface "/"</text>
  <text x="360" y="352" fill="#4EDFD1" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">end</text>
  <rect x="328" y="420" width="704" height="92" rx="8" fill="#EEF3FA" stroke="#C9D3E2"/>
  <text x="352" y="458" fill="#1557C0" font-family="Geist, Inter, system-ui, sans-serif" font-size="16" font-weight="600">Host-owned authorization</text>
  <text x="352" y="488" fill="#3B4762" font-family="Geist, Inter, system-ui, sans-serif" font-size="15">Threadline provides the surface. Your app decides who can see it.</text>
</svg>
