<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Threadline palette specimen</title>
  <desc id="desc">Brand color swatches for dark, light, accent, and semantic usage.</desc>
  <rect width="960" height="520" fill="#0B1020"/>
  <text x="48" y="62" fill="#D7DEEA" font-family="Geist, Inter, system-ui, sans-serif" font-size="30" font-weight="600">Threadline palette</text>
  <text x="48" y="94" fill="#8F9DB5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="2">RAW COLORS AND PRACTICAL ROLES</text>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#D7DEEA">
    <g transform="translate(48 132)"><rect width="132" height="96" rx="8" fill="#0B1020" stroke="#23304A"/><text y="124">Black</text><text y="144" fill="#8F9DB5">#0B1020</text></g>
    <g transform="translate(204 132)"><rect width="132" height="96" rx="8" fill="#141B2D" stroke="#23304A"/><text y="124">Graphite</text><text y="144" fill="#8F9DB5">#141B2D</text></g>
    <g transform="translate(360 132)"><rect width="132" height="96" rx="8" fill="#23304A"/><text y="124">Slate Line</text><text y="144" fill="#8F9DB5">#23304A</text></g>
    <g transform="translate(516 132)"><rect width="132" height="96" rx="8" fill="#D7DEEA"/><text y="124">Fog</text><text y="144" fill="#8F9DB5">#D7DEEA</text></g>
    <g transform="translate(672 132)"><rect width="132" height="96" rx="8" fill="#F7F9FC"/><text y="124">Paper</text><text y="144" fill="#8F9DB5">#F7F9FC</text></g>
    <g transform="translate(48 324)"><rect width="132" height="96" rx="8" fill="#4F8CFF"/><text y="124">Thread Blue</text><text y="144" fill="#8F9DB5">#4F8CFF</text></g>
    <g transform="translate(204 324)"><rect width="132" height="96" rx="8" fill="#4EDFD1"/><text y="124">Signal Cyan</text><text y="144" fill="#8F9DB5">#4EDFD1</text></g>
    <g transform="translate(360 324)"><rect width="132" height="96" rx="8" fill="#8A7CFF"/><text y="124">Iris</text><text y="144" fill="#8F9DB5">#8A7CFF</text></g>
    <g transform="translate(516 324)"><rect width="132" height="96" rx="8" fill="#FF8A5B"/><text y="124">Ember</text><text y="144" fill="#8F9DB5">#FF8A5B</text></g>
    <g transform="translate(672 324)"><rect width="132" height="96" rx="8" fill="#3FD08F"/><text y="124">Success</text><text y="144" fill="#8F9DB5">#3FD08F</text></g>
