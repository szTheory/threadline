<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Threadline mark">
  <!-- The extractable stitch mark — the favicon idiom at display scale (4x the 16px
       cut): one stitch rising out of the fabric line and diving back in. Stems and
       fabric are currentColor; the surfaced arc carries Stitch Blue. The fabric
       line paints last so the thread disappears behind it at the crossings. -->
  <path data-role="mark" fill="none" stroke="currentColor" stroke-width="6.8" d="M 20.8 54.4 V 43.6 M 43.2 54.4 V 43.6"/>
  <path data-role="mark" fill="none" stroke="#4781E6" stroke-width="6.8" d="M 20.8 43.6 V 24 A 11.2 11.2 0 0 1 43.2 24 V 43.6"/>
  <path data-role="mark" fill="none" stroke="currentColor" stroke-width="6.8" d="M 3.2 43.6 H 60.8"/>
</svg>
