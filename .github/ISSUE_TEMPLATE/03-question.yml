name: Question
description: Ask for help using or integrating Threadline.
title: "[Question]: "
labels: [question]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Tell us the outcome you are trying to reach and what you have already tried.
        Remove secrets, personal data, and production audit records before submitting. For a suspected vulnerability, use the private reporting route in the issue chooser.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What are you trying to accomplish with Threadline?
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      description: Include relevant documentation, configuration, commands, and outcomes.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Remove secrets, personal data, and production audit records from examples, logs, and screenshots.
