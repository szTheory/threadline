# Weekly / on-demand flake detection. Re-runs the test suite under
# `--repeat-until-failure` (fresh seed each repeat) to surface intermittent
# failures before they bite a release. Intentionally separate from ci.yml so
# per-PR CI stays fast; trigger manually from the Actions tab or let the weekly
# schedule run it on main.
#
# 218-05 (ECON-01, D-01/D-02): the lane used to run nightly with an unbounded
# 50-repeat soak that outgrew its job timeout, so it was cancelled four nights
# running and reported nothing. It now runs weekly with a bounded 15-repeat
# budget, so every run ends with a classification a maintainer can act on.
#
# GREEN-11 / D-35. This lane classifies what it found BY NAME rather than filing
# everything as "flaky":
#   * a failure on the FIRST iteration means the suite is BROKEN, not flaky
#   * a failure on a LATER iteration means FLAKY
#   * output that does not match the expected shape is reported as UNKNOWN with
#     the raw log attached — never silently downgraded to "flaky", which would
#     let a broken suite be filed as an intermittent annoyance
#   * a pass creates nothing and closes the open tracking issue, if any (D-06)
#   * a budget expiry is INCONCLUSIVE and a red ci.yml is BROKEN-UPSTREAM (D-04)
name: Flake Detection

on:
  workflow_dispatch:
  schedule:
    # Monday 07:00 UTC, weekly (after typical US/EU working hours). Weekly plus
    # on-demand dispatch gives a bounded signal instead of an unbounded nightly.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  # Job id is stable (relied on by docs/CI conventions); evolve `name:` freely.
  verify-flake:
    name: Suite repeat-until-failure (broken vs flaky)
    runs-on: ubuntu-24.04
    # `mix verify.flake` is `mix test --repeat-until-failure 15`: 16 suite runs
    # (the initial run plus 15 repeats).
    #
    # Budget arithmetic (D-01), from nightly run 35967937335 (2026-09-24, 1698
    # tests): 288 s cold first run + 15 x 165 s per repeat = 2,763 s, about
    # 46 min. The repeat step runs under a `timeout(1)` budget of 55 min, so a
    # budget expiry writes exit 124 (137 if the suite ignores SIGTERM for 60 s)
    # and is classified `inconclusive`, never `unknown` or `flaky`. The step
    # timeout (58) sits above that budget and below the job timeout (70), so the
    # classify, upload and issue steps always get to run. Re-measure and adjust
    # if the suite grows by a lot.
    timeout-minutes: 70
    # The actions scope (read) lets bin/ci-sha-gate query this and ci.yml's runs. A
    # job-level block zeroes every unlisted scope, and without it the gate's
    # API call would 403 and fail open to `run`, so the skip would never happen.
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      DB_HOST: localhost
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      # D-03/D-04: skip a scheduled run on a SHA this workflow already proved
      # green, and report `broken-upstream` instead of soaking a SHA whose CI is
      # red. Only `schedule` honors the skip; dispatch always runs. Any API error
      # fails open to `run`. Every heavy step below is gated on `run`.
      - name: Decide whether this SHA needs a flake run
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/ci-sha-gate --workflow flake-detection.yml --sha "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --upstream ci.yml

      - uses: erlef/setup-beam@v1
        if: steps.gate.outputs.decision == 'run'
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      # Key shape follows the CACHE KEY CONTRACT in ci.yml.
      - name: Cache deps
        if: steps.gate.outputs.decision == 'run'
        uses: actions/cache@v5
        with:
          path: deps
          key: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-

      - name: Install dependencies
        if: steps.gate.outputs.decision == 'run'
        run: mix deps.get

      - name: Compile (warnings as errors)
        if: steps.gate.outputs.decision == 'run'
        run: mix compile --warnings-as-errors

      # errexit-independent by construction (CR-01): GitHub runs every `run:`
      # body as `bash -e {0}`, and `set -uo pipefail` alone does NOT clear that
      # inherited `-e` — a failing `mix verify.flake` aborted this step before
      # `exit_code` was ever written, which silently skipped classification and
      # the issue step below it. `set +e` disables errexit explicitly so the
      # write on line below always runs, and the step then exits 0 itself so a
      # failing suite cannot fail (and thus skip) this step. The job is still
      # failed deliberately, but only at the very end, after classification and
      # issue handling have both run.
      #
      # `timeout(1)` rather than only the step timeout: a GitHub step timeout
      # kills the step before `exit_code` is written, which the classifier could
      # only report as `unknown`. Under `timeout(1)` a budget expiry still writes
      # `exit_code=124` (or 137 after the 60 s kill grace).
      - name: Repeat the suite until failure
        id: repeat
        if: steps.gate.outputs.decision == 'run'
        timeout-minutes: 58
        run: |
          set +e
          set -uo pipefail
          timeout --signal=TERM --kill-after=60s 55m mix verify.flake 2>&1 | tee flake-detection.log
          exit_code="${PIPESTATUS[0]}"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      # `if: always()` is the CR-01 fix: without it this step defaults to
      # `success()` and is skipped whenever the repeat step above reports a
      # failing suite — precisely the only path this classifier exists for.
      # test/threadline/flake_classifier_contract_test.exs (Test 2) asserts
      # this condition stays present.
      #
      # Classification logic itself lives in bin/classify-flake-run (extracted
      # per CR-01/CR-02 so it is directly executable and unit-tested by
      # test/threadline/flake_classifier_contract_test.exs rather than reachable
      # only via this weekly job). This step just supplies the
      # inputs and derives `iterations` for the issue body below — no
      # classification branching happens here.
      - name: Classify broken vs flaky
        id: classify
        if: always()
        env:
          GATE_DECISION: ${{ steps.gate.outputs.decision }}
          EXIT_CODE: ${{ steps.repeat.outputs.exit_code }}
        run: |
          set -uo pipefail
          classification=$(bin/classify-flake-run flake-detection.log)

          iterations=$(grep -c 'Running ExUnit with seed:' flake-detection.log 2>/dev/null || echo 0)
          if ! printf '%s' "$iterations" | grep -Eq '^[0-9]+$'; then
            iterations=0
          fi

          echo "iterations=$iterations" >> "$GITHUB_OUTPUT"
          echo "::notice::Flake Detection classification: $classification (completed iterations: $iterations, exit: $EXIT_CODE)"

      # Uploaded whenever the suite ran: the UNKNOWN branch is only actionable
      # with the raw log. A gated-off run (skip / broken-upstream) has no log.
      - name: Upload raw repeat-until-failure log
        if: always() && steps.gate.outputs.decision == 'run'
        uses: actions/upload-artifact@v7
        with:
          name: flake-detection-log
          path: flake-detection.log
          if-no-files-found: warn
          retention-days: 14

      # Create-or-update ONE tracking issue, never a new issue per run. `schedule`
      # runs notify nobody, so without this a scheduled failure is invisible; with a
      # create-per-run it would be invisible for the opposite reason.
      #
      # The label is deliberately distinct from browser-full.yml's `ci-browser-full`
      # so the two dedup streams do not merge into a single issue and mask each other.
      #
      # Dedup keys on the FIXED title prefix, while the classification rides in the
      # title suffix and the body — so a lane that flips broken -> flaky still lands
      # on the same issue instead of forking a second one.
      # `if: always() && ...` gates this on the classification VALUE rather
      # than the implicit success of everything before it (Task 2 item 4) —
      # so a future step inserted between `repeat` and here that changes the
      # default success chain cannot silently re-skip issue filing. Still does
      # not fire when the classification is `pass`, or `skip` (a skip is only
      # reachable after a real pass on this SHA). `inconclusive` and
      # `broken-upstream` DO end red and file: a green non-proof would count as
      # success on this SHA and make every later scheduled run skip it.
      - name: Open or update the flake tracking issue
        if: always() && steps.classify.outputs.classification != 'pass' && steps.classify.outputs.classification != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE_PREFIX: "Flake Detection: test suite"
          LABEL: ci-flake
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
          ITERATIONS: ${{ steps.classify.outputs.iterations }}
          REASON: ${{ steps.classify.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # D-04: every arm states the cause the classifier actually found.
          # REASON is one of bin/classify-flake-run's fixed reason strings.
          log_note="The full \`mix verify.flake\` output is attached to the run as the \`flake-detection-log\` artifact."
          case "$CLASSIFICATION" in
            broken)
              headline="The suite is **broken**, not flaky — it failed on the FIRST iteration."
              detail="A first-iteration failure is a deterministic failure. Do not triage this as an intermittent test; the suite does not pass even once."
              ;;
            flaky)
              headline="The suite is **flaky** — it passed $((ITERATIONS - 1)) time(s), then failed on iteration ${ITERATIONS}."
              detail="First failing iteration: ${ITERATIONS}. Earlier iterations passed, so this is genuinely intermittent."
              ;;
            inconclusive)
              headline="The run is **inconclusive** — the time budget ran out after $((ITERATIONS > 0 ? ITERATIONS - 1 : 0)) clean iteration(s), with no failure seen."
              detail="This is not a flake report. The weekly budget is stale for the suite's size: re-measure the per-iteration time and resize the repeat count or the budget."
              ;;
            broken-upstream)
              headline="CI (ci.yml) is **red** on this SHA, so the flake suite was not run."
              detail="Fix CI first. The next weekly or dispatched run re-checks this."
              log_note="The suite did not run, so no \`flake-detection-log\` artifact was uploaded."
              ;;
            *)
              headline="Classification is **unknown** (\`${CLASSIFICATION}\`)."
              detail="Reason: ${REASON}. Deliberately NOT reported as flaky: guessing here is how a broken suite gets filed as an intermittent annoyance."
              ;;
          esac

          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          cat > "$body_file" <<EOF
          ${headline}

          ${detail}

          - Classification: \`${CLASSIFICATION}\`
          - Reason: ${REASON}
          - Suite headers seen: \`${ITERATIONS}\`
          - Run: ${RUN_URL}
          - Commit: \`${GITHUB_SHA}\` (${GITHUB_EVENT_NAME})

          ${log_note}

          This issue is reused across runs — repeated failures accumulate here as
          comments rather than opening a new issue each run. A passing run closes it.
          EOF
          bin/upsert-ci-issue --marker "$TITLE_PREFIX" \
            --title "$TITLE_PREFIX reported ${CLASSIFICATION}" \
            --body-file "$body_file" --label "$LABEL" \
            --label-description "Flake Detection lane: suite reported broken, flaky, inconclusive, broken-upstream or unknown" \
            --label-color D93F0B

      # D-06 close-on-green. Green means PROVEN green: only `pass` closes. A skip,
      # inconclusive, broken-upstream or unknown run never closes the issue, since
      # closing on a non-proof would bury a live failure. TITLE_PREFIX and LABEL
      # must match the issue step above, or the close finds no issue (action=none).
      - name: Close the flake tracking issue on a passing run
        if: always() && steps.classify.outputs.classification == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE_PREFIX: "Flake Detection: test suite"
          LABEL: ci-flake
          ITERATIONS: ${{ steps.classify.outputs.iterations }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          printf 'Passed %s iteration(s) on %s (%s): %s\n' "$ITERATIONS" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$RUN_URL" > "$body_file"
          bin/upsert-ci-issue --close --marker "$TITLE_PREFIX" --label "$LABEL" --body-file "$body_file"

      # The job must still be red when the suite failed. Classification and issue
      # filing above are reporting, not absolution. `always()` keeps this step
      # reachable even if an earlier reporting step were to fail outright.
      - name: Fail the job if the suite did not pass
        if: always() && steps.classify.outputs.classification != 'pass' && steps.classify.outputs.classification != 'skip'
        run: |
          echo "::error::Flake Detection classified this run as '${{ steps.classify.outputs.classification }}' after ${{ steps.classify.outputs.iterations }} iteration(s)."
          exit 1
