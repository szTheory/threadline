# Job id contract — stable YAML `jobs:` keys are relied on by docs and `act`:
# verify-format, verify-credo, verify-dialyzer, verify-compile-no-optional, verify-test, verify-pgbouncer-topology, verify-hex-evaluator, verify-example-browser, verify-mechanical, verify-capture, verify-docs, verify-hex-package, verify-release-shape, verify-bump-rehearsal, ci-required
#
# `ci-required` (name: "CI required") is the SINGLE required status check on
# `main` (D-08). Branch protection points at it and at nothing else. It is the
# extension point for future lanes: a new verify-* job becomes blocking by being
# added to `ci-required`'s `needs:` list — with zero branch-protection edits.
#
# ---------------------------------------------------------------------------
# NO TRIGGER-LEVEL PATH FILTERS — a decision, not an omission (Phase 198, D-10 /
# D-20). This workflow deliberately carries no `paths:` key under `on:`.
#
# Why: a workflow filtered out at the trigger level never reports AT ALL, and a
# pull request whose required check never reports sits on "Expected — Waiting
# for status to be reported" forever. `ci-required` is the single required
# check, so trigger-level filtering here would deadlock every doc-only PR. With
# five workflows and a library-shaped repository the saving would be small
# anyway, and path filters additionally risk `main` divergence (something that
# never ran on a PR merges unverified).
#
# If filtering is ever genuinely wanted, the SANCTIONED mechanism is: a
# dedicated change-detection job plus JOB-LEVEL `if:` conditions, each carrying
# `|| github.ref == 'refs/heads/main'` so expensive jobs still run on main (the
# CLAUDE.md "path filters + main" convention). Note the consequence for the
# aggregate: the first conditionally-skipped job added to `ci-required`'s
# `needs:` MUST also be registered in that job's `allowed-skips` input, or the
# gate will correctly fail on its skip.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow the Release workflow's "Bootstrap CI on Release PR" job to dispatch CI
  # onto the release-please branch (`gh workflow run ci.yml --ref ...`). Without
  # this trigger the dispatch fails with HTTP 422.
  workflow_dispatch:

permissions:
  contents: read

# Cancel only superseded pull_request runs. push-to-main and the release-PR
# `workflow_dispatch` land in distinct groups (github.ref differs) and are never
# cancelled, so gate-ci-green (keyed on head_sha) is unaffected (D-23).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-format:
    name: Check formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      # CACHE KEY CONTRACT (Phase 198, D-19) — read before adding any cache.
      #
      # Every key is composed of: runner label + OTP version + Elixir version +
      # lockfile hash. NEVER compose a key from the OS-family context value of
      # the runner: it resolves to the literal `Linux` on every ubuntu image, so
      # a 22.04 lane and a 24.04 lane silently share one entry. (An anti-
      # regression grep asserts that expression appears nowhere in this file,
      # which is why it is not spelled out here.) For non-matrix jobs the
      # runner/OTP/Elixir
      # segments are the literals that job already pins above; for the
      # verify-test matrix they come from the matrix values.
      #
      # There is currently NO `_build` cache in this workflow — only `deps` and
      # the Playwright browser download. If one is ever added, two rules apply:
      #   * it gets NO `restore-keys`. A partial restore across a changed
      #     mix.lock is the stale-compiled-artifact footgun; a cold build is
      #     cheaper than a wrong one.
      #   * add `rm -rf _build/$MIX_ENV/lib/threadline` before the compile step,
      #     so a restored cache can never serve a stale copy of the code under
      #     test.
      #
      # FORWARD REQUIREMENT FOR PHASE 199 (dialyzer PLT cache) — do not build a
      # key shape 199 has to redo. The PLT key must ADDITIONALLY include:
      #   * `hashFiles('mix.exs')` — mix.exs is where `plt_add_apps` for the
      #     optional dependencies lives, so a PLT built before that list changed
      #     is wrong, not merely stale.
      #   * the OTP version — PLTs are not portable across OTP.
      # Unlike `_build`, PLT `restore-keys` ARE correct: PLTs update
      # incrementally, so a near-miss restore is a genuine speedup.
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix verify.format

  verify-credo:
    name: Run Credo (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Credo
        run: mix verify.credo

  verify-dialyzer:
    name: Dialyzer (current toolchain)
    runs-on: ubuntu-24.04
    # Plan 199-14 measured the cold job at 252 seconds. A 2x headroom factor,
    # rounded up to the next whole minute, gives ceil(252 * 2 / 60) = 9.
    timeout-minutes: 9
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-

      - name: Restore Dialyzer PLT
        id: dialyzer-plt-restore
        uses: actions/cache/restore@v4
        with:
          path: .dialyzer
          key: ubuntu-24.04-otp27.0-elixir1.17.3-dialyzer-plt-${{ hashFiles('mix.lock') }}-${{ hashFiles('mix.exs') }}
          restore-keys: ubuntu-24.04-otp27.0-elixir1.17.3-dialyzer-plt-

      # Dependency work is deliberately outside both GNU time measurements.
      - name: Install dependencies
        run: mix deps.get

      - name: Compile full optional build
        run: mix compile --warnings-as-errors

      - name: Build and measure Dialyzer PLT on cache miss
        if: steps.dialyzer-plt-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          time_file="${RUNNER_TEMP}/dialyzer-plt-time.txt"
          dialyzer_status=0
          /usr/bin/time -v -o "$time_file" mix dialyzer --plt || dialyzer_status=$?

          wall_count=$(grep -c 'Elapsed (wall clock) time' "$time_file" || true)
          rss_count=$(grep -c 'Maximum resident set size (kbytes)' "$time_file" || true)
          wall_raw=$(sed -n 's/^[[:space:]]*Elapsed (wall clock) time (h:mm:ss or m:ss):[[:space:]]*//p' "$time_file")
          max_rss_kb=$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes):[[:space:]]*//p' "$time_file")
          wall_seconds=$(awk -F: '
            NF == 2 { printf "%.2f", ($1 * 60) + $2; found = 1 }
            NF == 3 { printf "%.2f", ($1 * 3600) + ($2 * 60) + $3; found = 1 }
            END { if (!found) exit 1 }
          ' <<< "$wall_raw") || {
            echo "::error::Unable to parse GNU time output for Dialyzer PLT wall time"
            cat "$time_file"
            exit 1
          }

          if [[ "$wall_count" -ne 1 || "$rss_count" -ne 1 ]] ||
             ! [[ "$wall_seconds" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
             ! [[ "$max_rss_kb" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse GNU time output for Dialyzer PLT measurements"
            cat "$time_file"
            exit 1
          fi

          echo "THREADLINE_DIALYZER_PLT_CACHE=miss"
          echo "THREADLINE_DIALYZER_PLT_WALL_SECONDS=${wall_seconds}"
          echo "THREADLINE_DIALYZER_PLT_MAX_RSS_KB=${max_rss_kb}"
          exit "$dialyzer_status"

      # Save a successfully built/updated PLT before analysis so an analyzer
      # warning cannot discard the expensive, valid cache artifact.
      - name: Save Dialyzer PLT
        if: steps.dialyzer-plt-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .dialyzer
          key: ${{ steps.dialyzer-plt-restore.outputs.cache-primary-key }}

      - name: Report exact PLT cache hit
        if: steps.dialyzer-plt-restore.outputs.cache-hit == 'true'
        run: echo "THREADLINE_DIALYZER_PLT_CACHE=hit"

      - name: Analyze and measure with Dialyzer
        shell: bash
        run: |
          set -euo pipefail
          time_file="${RUNNER_TEMP}/dialyzer-analysis-time.txt"
          dialyzer_status=0
          /usr/bin/time -v -o "$time_file" mix dialyzer --no-check || dialyzer_status=$?

          wall_count=$(grep -c 'Elapsed (wall clock) time' "$time_file" || true)
          rss_count=$(grep -c 'Maximum resident set size (kbytes)' "$time_file" || true)
          wall_raw=$(sed -n 's/^[[:space:]]*Elapsed (wall clock) time (h:mm:ss or m:ss):[[:space:]]*//p' "$time_file")
          max_rss_kb=$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes):[[:space:]]*//p' "$time_file")
          wall_seconds=$(awk -F: '
            NF == 2 { printf "%.2f", ($1 * 60) + $2; found = 1 }
            NF == 3 { printf "%.2f", ($1 * 3600) + ($2 * 60) + $3; found = 1 }
            END { if (!found) exit 1 }
          ' <<< "$wall_raw") || {
            echo "::error::Unable to parse GNU time output for Dialyzer analysis wall time"
            cat "$time_file"
            exit 1
          }

          if [[ "$wall_count" -ne 1 || "$rss_count" -ne 1 ]] ||
             ! [[ "$wall_seconds" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
             ! [[ "$max_rss_kb" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse GNU time output for Dialyzer analysis measurements"
            cat "$time_file"
            exit 1
          fi

          echo "THREADLINE_DIALYZER_ANALYSIS_WALL_SECONDS=${wall_seconds}"
          echo "THREADLINE_DIALYZER_ANALYSIS_MAX_RSS_KB=${max_rss_kb}"
          exit "$dialyzer_status"

  verify-compile-no-optional:
    name: Compile without optional deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile without optional deps (warnings-as-errors)
        run: mix verify.compile_no_optional

  verify-test:
    # Base axis `lane` drives the check-name suffix → GitHub posts exactly
    # "Run test suite (min)" and "Run test suite (current)". Keys carried only
    # via `include` (elixir/otp/pg/runner) do NOT append to that suffix, so the
    # static `name:` yields the two documented required checks (D-15/D-19,
    # RESEARCH M1 construction A). Min lane = elixir 1.15 / otp 26 / pg14 /
    # ubuntu-22.04 proving the declared floor; current lane = the full payload.
    name: Run test suite
    strategy:
      fail-fast: false
      matrix:
        lane: [min, current]
        include:
          - lane: min
            elixir: "1.15"
            otp: "26"
            pg: "14"
            runner: "ubuntu-22.04"
          - lane: current
            elixir: "1.17.3"
            otp: "27"
            pg: "16"
            runner: "ubuntu-24.04"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DB_HOST: localhost
      MIX_ENV: test
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # THE bug this key shape fixes (D-19): the previous key led with the
      # OS-family context value of the runner, which is the literal string
      # `Linux` on BOTH ubuntu-22.04 and ubuntu-24.04 and carries no OTP or
      # Elixir at all. The min lane (elixir
      # 1.15 / otp 26 / ubuntu-22.04) and the current lane (1.17.3 / 27 /
      # ubuntu-24.04) therefore shared ONE cache entry — the min lane could be
      # "verified" against dependencies compiled for current, which is a false
      # green on the Elixir 1.15 floor promise, not merely a slow build.
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ matrix.runner }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ matrix.runner }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Verify no compile-connected xref cycles
        run: mix verify.xref_cycles

      - name: Run tests
        run: mix verify.test

      - name: Verify Threadline trigger coverage
        if: matrix.lane == 'current'
        run: mix verify.threadline

      - name: Ensure threadline_phoenix_test database exists (threadline on search_path)
        if: matrix.lane == 'current'
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h "$DB_HOST" -U postgres threadline_phoenix_test 2>/dev/null || true
          # The audit tables live in the dedicated `threadline` schema; the demo
          # seed queries them unqualified, so `threadline` must be on the DB
          # search_path (nothing in app config or a migration sets it). This
          # statement is deliberately confined to the example-app database —
          # never applied to the root library's own `threadline_test` database.
          psql -h "$DB_HOST" -U postgres -d threadline_phoenix_test \
            -c "ALTER DATABASE threadline_phoenix_test SET search_path TO \"\$user\", public, threadline;"

      - name: Verify Threadline Phoenix example
        if: matrix.lane == 'current'
        run: mix verify.example

  verify-hex-evaluator:
    name: Hex evaluator smoke (threadline from hex.pm)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DB_HOST: localhost
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - name: Ensure hex_evaluator_test database exists
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h "$DB_HOST" -U postgres hex_evaluator_test 2>/dev/null || true

      - name: Verify Hex-published threadline adopt path
        run: mix verify.hex_evaluator

  verify-example-browser:
    name: Example app browser E2E (Playwright)
    runs-on: ubuntu-24.04
    # 18 is a BUDGET (D-16), not a multiple of an observed green p95 — this lane
    # has no observed green duration to size against. Its two recorded runs are
    # 1h33m38s while systemically broken (run 28214113903) and 2m04s while
    # fast-failing (run 33113148222). 18 is therefore a deliberate ceiling: it
    # will fail a lane that regresses back toward the 1h33m case rather than
    # silently absorbing it. Re-derive from a real green run when one exists.
    timeout-minutes: 18
    env:
      DB_HOST: localhost
      DB_PORT: 5432
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/threadline_phoenix/e2e/package-lock.json

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-24.04-playwright-${{ hashFiles('examples/threadline_phoenix/e2e/package-lock.json') }}
          restore-keys: ubuntu-24.04-playwright-

      - name: Install root dependencies
        run: mix deps.get

      - name: Ensure threadline_phoenix_test database exists
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h "$DB_HOST" -U postgres threadline_phoenix_test 2>/dev/null || true
          # The audit tables live in the dedicated `threadline` schema; the demo
          # seed queries them unqualified, so `threadline` must be on the DB
          # search_path (nothing in app config or a migration sets it).
          psql -h "$DB_HOST" -U postgres -d threadline_phoenix_test \
            -c "ALTER DATABASE threadline_phoenix_test SET search_path TO \"\$user\", public, threadline;"

      # Reduced pull-request lane (Phase 198, D-17). Runs ONLY the two
      # interactive Chromium projects. The remaining projects (the capture
      # lanes) run on push-to-main and nightly in browser-full.yml, which is
      # deliberately NOT part of `ci-required`. This is a real coverage/latency
      # trade, not a free win: what moved is stated verbatim in CONTRIBUTING.md
      # under "## CI Coverage" and asserted by
      # test/threadline/ci_coverage_doc_contract_test.exs.
      #
      # This job's `name:` is byte-identical to its pre-split value on purpose —
      # GitHub matches required checks on NAME, and this job stays inside
      # `ci-required`'s needs list and continues to vote.
      # Strictly less than the job-level 18 so the STEP fails first — a job-level
      # timeout kills the runner outright and the failure-artifact upload below
      # never executes. 14 < 18 keeps the diagnosis path alive.
      - name: Run example Playwright suite
        timeout-minutes: 14
        run: mix verify.example_browser --project=desktop-chromium --project=mobile-chromium

      # Diagnosis half of D-18. maxFailures aborts the run after 5 failures, so
      # this step is what makes that abort useful: it preserves the retained
      # traces (playwright.config.ts `trace: "retain-on-failure"`) for the
      # failures that DID occur, plus the phx.server boot log that explains a
      # preflight abort. Ordered AFTER the Playwright step and guarded on
      # failure() so it runs precisely when the run died early.
      - name: Upload Playwright traces and e2e boot log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-browser-e2e-diagnostics
          path: |
            examples/threadline_phoenix/e2e/test-results
            examples/threadline_phoenix/e2e/playwright-report
            /tmp/threadline_phoenix_e2e.log
          if-no-files-found: warn
          retention-days: 14

  # Deterministic mechanical gate over the committed Tier A evidence. Fast on
  # every PR — no browser — and blocks a change if the committed
  # test/fixtures/operator_surface/scorecards/*.json breach any MODE-A (WCAG / token conformance) or
  # MODE-B (ratchet-floor) rule. The alias runs mechanical_checker_test.exs,
  # whose real-evidence gate starts the application (and therefore the repo)
  # to call MechanicalChecker.run/1 over the committed scorecards — it DOES
  # need a database, unlike a purely arithmetic check.
  verify-mechanical:
    name: Mechanical checker (committed scorecards)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Run mechanical checker
        run: mix verify.mechanical

  # Heavy recurring gate: regenerate the Tier A capture from scratch against a
  # migrated example DB + real browser, and assert (1) the evidence bundle is
  # non-empty and complete (every aria.yml has a matching scorecard JSON), (2)
  # regeneration is byte-stable against the committed evidence (no drift), and
  # (3) MechanicalChecker.run/1 is clean over it. This is the recurring proof
  # of the two former human-UAT items (194-UAT.md).
  verify-capture:
    name: Tier A capture lane (byte-stable evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DB_HOST: localhost
      DB_PORT: 5432
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/threadline_phoenix/e2e/package-lock.json

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-24.04-playwright-${{ hashFiles('examples/threadline_phoenix/e2e/package-lock.json') }}
          restore-keys: ubuntu-24.04-playwright-

      - name: Install root dependencies
        run: mix deps.get

      - name: Ensure threadline_phoenix_test database exists (threadline on search_path)
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h "$DB_HOST" -U postgres threadline_phoenix_test 2>/dev/null || true
          # The audit tables live in the dedicated `threadline` schema; the demo
          # seed queries them unqualified, so `threadline` must be on the DB
          # search_path (nothing in app config or a migration sets it).
          psql -h "$DB_HOST" -U postgres -d threadline_phoenix_test \
            -c "ALTER DATABASE threadline_phoenix_test SET search_path TO \"\$user\", public, threadline;"

      - name: Regenerate Tier A capture
        run: mix verify.capture

      - name: Assert complete evidence bundle (non-empty, every aria.yml has a matching scorecard)
        run: |
          json=$(find test/fixtures/operator_surface/scorecards -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')
          aria=$(find test/fixtures/operator_surface/scorecards -maxdepth 1 -name '*.aria.yml' | wc -l | tr -d ' ')
          echo "scorecards: ${json} json, ${aria} aria.yml"
          # Non-vacuity floor: a zero count means the capture produced nothing,
          # which a broken glob or an aborted run would also produce.
          if [ "$json" -eq 0 ]; then
            echo "::error::a zero scorecard JSON count means the capture produced nothing"
            exit 1
          fi
          if [ "$aria" -eq 0 ]; then
            echo "::error::a zero aria.yml count means the capture produced nothing"
            exit 1
          fi
          # Completeness: this is what "complete bundle" actually means, and it
          # stays true at any bundle size (unlike a pinned absolute count).
          missing=""
          for f in test/fixtures/operator_surface/scorecards/*.aria.yml; do
            stem=$(basename "$f" .aria.yml)
            if [ ! -f "test/fixtures/operator_surface/scorecards/${stem}.json" ]; then
              missing="${missing} ${stem}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::orphan aria.yml with no matching scorecard JSON:${missing}"
            exit 1
          fi

      - name: Assert byte-stable regeneration (no drift from committed evidence)
        run: |
          if [ -n "$(git status --porcelain test/fixtures/operator_surface/scorecards/)" ]; then
            echo "::error::Tier A capture is not byte-stable, or committed evidence is stale."
            echo "Regenerate locally with 'mix verify.capture' and commit the result."
            git status --porcelain test/fixtures/operator_surface/scorecards/
            git diff -- test/fixtures/operator_surface/scorecards/ | head -200
            exit 1
          fi
          echo "Regeneration is byte-identical to the committed evidence."

      - name: Assert mechanical checker clean over real evidence
        run: mix verify.mechanical

  verify-pgbouncer-topology:
    name: PgBouncer transaction topology
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadline_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/threadline_test
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_CLIENT_CONN: 200
          DEFAULT_POOL_SIZE: 5
        ports:
          - 6432:5432
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-

      - name: Wait for Postgres and PgBouncer
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
          until pg_isready -h localhost -p 6432 -U postgres; do sleep 1; done

      - name: Bootstrap test DB (direct Postgres, bypass pooler)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          THREADLINE_TOPOLOGY_BOOTSTRAP: "1"
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix run priv/ci/topology_bootstrap.exs

      - name: Topology tests + verify_coverage through PgBouncer
        env:
          DB_HOST: localhost
          DB_PORT: "6432"
          THREADLINE_PGBOUNCER_TOPOLOGY: "1"
        run: |
          mix verify.topology
          mix verify.threadline

  verify-docs:
    name: Build ExDoc (dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Build docs
        run: mix docs

  verify-hex-package:
    name: Hex package tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-otp27.0-elixir1.17.3-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Build and inspect Hex tarball
        run: |
          set -euo pipefail
          mix hex.build
          shopt -s nullglob
          archives=(threadline-*.tar)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No threadline-*.tar produced" >&2
            exit 1
          fi
          for t in "${archives[@]}"; do
            # Hex wraps sources in contents.tar.gz inside the outer .tar
            if tar tf "$t" | grep -q '^contents\.tar\.gz$'; then
              tmp=$(mktemp -d)
              tar xf "$t" -C "$tmp" contents.tar.gz
              # grep -q can close the pipe early; without this, pipefail makes tar SIGPIPE fail the step
              set +o pipefail
              inner_ok=false
              if tar tzf "$tmp/contents.tar.gz" | grep -qE '^lib/'; then inner_ok=true; fi
              set -o pipefail
              if [[ "$inner_ok" == true ]]; then
                echo "OK: $t → contents.tar.gz contains lib/"
              else
                echo "contents.tar.gz missing lib/: $t" >&2
                set +o pipefail
                tar tzf "$tmp/contents.tar.gz" | head -40 >&2
                set -o pipefail
                rm -rf "$tmp"
                exit 1
              fi
              rm -rf "$tmp"
            elif tar tf "$t" | grep -qE '^lib/'; then
              echo "OK: $t contains lib/ at archive root"
            elif tar tf "$t" | grep -qE '^[^/]+/lib/'; then
              echo "OK: $t contains */lib/"
            else
              echo "Tarball missing expected layout: $t" >&2
              tar tf "$t" | head -40 >&2
              exit 1
            fi
          done

  verify-release-shape:
    name: Release metadata (version / changelog)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Verify CHANGELOG and @version alignment
        run: bin/verify-release-shape

  verify-bump-rehearsal:
    name: Bump rehearsal (next minor)
    runs-on: ubuntu-24.04
    # Measured at 66s wall locally (macOS, 295% CPU) for the full run: throwaway
    # clone, deps.get, mix release.pins, the doc-contract tests it derives by
    # filename, verify.release (which builds ExDoc and the Hex tarball). 15 gives
    # roughly 4x headroom on a slower 2-core hosted runner without hiding a hang.
    timeout-minutes: 15
    env:
      DB_HOST: localhost
    services:
      # The rehearsal runs the doc-contract files it derives by filename, plus
      # verify.release and the release contract tests, and test/test_helper.exs
      # creates and migrates the test database on boot. No database means no
      # rehearsal, which this gate scores as a failure rather than a pass.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # fetch-depth: 0 because bin/verify-bump-rehearsal clones this checkout
      # into a throwaway tree. A depth-1 checkout would make that clone shallow
      # and couple the gate to git's shallow-source behaviour for no benefit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      # Deliberately NO `deps` cache here. The rehearsal fetches dependencies
      # inside its own throwaway clone, so this job's `deps/` directory is never
      # populated or read — a cache entry keyed on it would restore nothing that
      # is used, while adding a key shape to the CACHE KEY CONTRACT above that
      # nothing verifies. A cold dependency fetch inside the clone is the honest
      # cost of rehearsing a fresh release checkout.
      - name: Rehearse the next minor bump
        run: mix verify.bump_rehearsal

  # The single required status check on `main` (D-08). Collapses every job above
  # into one pass/fail signal so branch protection names one context, not fourteen,
  # and so no required-check name carries a matrix axis that could rot.
  #
  # `if: always()` is load-bearing (D-09): a job that `needs:` a FAILED job is
  # itself marked *skipped*, and GitHub scores a skipped required check as
  # PASSING. Without `always()` this gate would go green on exactly the failures
  # it exists to catch. `jobs: ${{ toJSON(needs) }}` then inspects every result
  # value (success|failure|cancelled|skipped) rather than grepping result
  # strings — do NOT replace it with a hand-rolled result-string containment
  # expression over the needs results, which scores skipped-on-dependency-
  # failure as a pass.
  ci-required:
    name: CI required
    if: always()
    needs:
      - verify-format
      - verify-credo
      - verify-dialyzer
      - verify-compile-no-optional
      - verify-test
      - verify-hex-evaluator
      - verify-example-browser
      - verify-mechanical
      - verify-capture
      - verify-pgbouncer-topology
      - verify-docs
      - verify-hex-package
      - verify-release-shape
      - verify-bump-rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Decide whether all needed jobs succeeded
        # v1.2.2 / release/v1, pinned so the sole required-check decision cannot
        # change without a reviewed repository commit.
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35
        with:
          jobs: ${{ toJSON(needs) }}
          # Extension point: the first `needs:` job that becomes conditionally
          # skipped (a job-level `if:`) must be listed here via `allowed-skips`,
          # or this gate will correctly fail on its skip. Deliberately absent
          # today — all fourteen jobs above run unconditionally, so neither
          # `allowed-skips` nor `allowed-failures` applies yet.
