# Job id contract — stable YAML `jobs:` keys are relied on by docs and `act`:
# verify-release-shape, verify-repo-hygiene, verify-format, verify-deps-audit, verify-compile-no-optional, verify-hex-evaluator, verify-pgbouncer-topology, verify-credo, verify-bump-rehearsal, verify-dialyzer, verify-test, verify-capture, verify-example-browser, ci-required
#
# `ci-required` (name: "CI required") is the SINGLE required status check on
# `main` (D-08). Branch protection points at it and at nothing else. It is the
# extension point for future lanes: a new verify-* job becomes blocking by being
# added to `ci-required`'s `needs:` list — with zero branch-protection edits.
#
# ---------------------------------------------------------------------------
# NO TRIGGER-LEVEL PATH FILTERS — a decision, not an omission (Phase 198, D-10 /
# D-20). This workflow deliberately carries no `paths:` key under `on:`.
#
# Why: a workflow filtered out at the trigger level never reports AT ALL, and a
# pull request whose required check never reports sits on "Expected — Waiting
# for status to be reported" forever. `ci-required` is the single required
# check, so trigger-level filtering here would deadlock every doc-only PR. With
# five workflows and a library-shaped repository the saving would be small
# anyway, and path filters additionally risk `main` divergence (something that
# never ran on a PR merges unverified).
#
# If filtering is ever genuinely wanted, the SANCTIONED mechanism is: a
# dedicated change-detection job plus JOB-LEVEL `if:` conditions, each carrying
# `|| github.ref == 'refs/heads/main'` so expensive jobs still run on main (the
# CLAUDE.md "path filters + main" convention). Note the consequence for the
# aggregate: the first conditionally-skipped job added to `ci-required`'s
# `needs:` MUST also be registered in that job's `allowed-skips` input, or the
# gate will correctly fail on its skip.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow the Release workflow's "Bootstrap CI on Release PR" job to dispatch CI
  # onto the release-please branch (`gh workflow run ci.yml --ref ...`). Without
  # this trigger the dispatch fails with HTTP 422.
  workflow_dispatch:

permissions:
  contents: read

# Cancel only superseded pull_request runs. push-to-main and the release-PR
# `workflow_dispatch` land in distinct groups (github.ref differs) and are never
# cancelled, so gate-ci-green (keyed on head_sha) is unaffected (D-23).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Removed: verify-docs (plain `mix docs`). Failure class "the ExDoc build fails"
  # is still caught by verify-bump-rehearsal, whose `mix verify.release` gate runs
  # `MIX_ENV=dev mix docs --warnings-as-errors`, on push to main, pull_request and
  # workflow_dispatch. A change that skips verify-bump-rehearsal skips this proof too.

  # Removed: verify-hex-package (`mix hex.build` plus a lib/ check). Failure class
  # "hex.build fails or the tarball has no usable lib/" is still caught by
  # verify-bump-rehearsal (`mix hex.build` in `mix verify.release`) and
  # verify-hex-evaluator (builds this tree's tarball, resolves it from the
  # rehearsal registry, compiles and tests it), on push to main, pull_request and
  # workflow_dispatch.

  verify-release-shape:
    name: CHANGELOG matches version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Verify CHANGELOG and @version alignment
        run: bin/verify-release-shape

  verify-repo-hygiene:
    name: Repo hygiene (no machine-local paths)
    runs-on: ubuntu-24.04
    # Measured locally: `bin/verify-repo-hygiene` ~1.5s + `bin/verify-repo-hygiene
    # --self-test` ~1.4s = ~3s combined wall time. 10 minutes is the repo's
    # timeout floor and gives enormous headroom on a slower hosted runner
    # without hiding a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Deliberately no erlef/setup-beam and no cache: the guard is pure git +
      # bash + perl (see bin/verify-repo-hygiene), and `mix verify.repo_hygiene`
      # shells to the identical script with no arguments, so CI and `ci.all`
      # run identical logic without needing a BEAM toolchain in this job.
      - name: Scan tracked text for machine-local paths
        run: bin/verify-repo-hygiene

      - name: Prove the guard goes red (runtime-built fixtures)
        run: bin/verify-repo-hygiene --self-test

  verify-format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      # CACHE KEY CONTRACT (Phase 198 D-19, Phase 219 CACHE-01) — read before adding any cache.
      #
      # Every key is composed of: runner label + OTP version + Elixir version +
      # lockfile hash. NEVER compose a key from the OS-family context value of
      # the runner: it resolves to the literal `Linux` on every ubuntu image, so
      # a 22.04 lane and a 24.04 lane silently share one entry. (An anti-
      # regression grep asserts that expression appears nowhere in this file,
      # which is why it is not spelled out here.) For non-matrix jobs the OTP
      # and Elixir segments come from the `beam` setup step's resolved outputs
      # (`steps.beam.outputs.otp-version` / `elixir-version`), so a key names
      # what was installed, not what was requested; the runner label stays a
      # literal. For the verify-test matrix too, the matrix values only select
      # what to install: the OTP and Elixir segments come from the same `beam`
      # step outputs, led by `${{ matrix.runner }}`.
      #
      # The test jobs verify-test, verify-pgbouncer-topology,
      # verify-example-browser and verify-capture restore deps-only `_build`
      # caches with split actions/cache/restore + actions/cache/save steps
      # (verify-pgbouncer-topology restores only, never saves). Their keys add
      # `build-v1`, the project (`root` or `example`), MIX_ENV, the `full`
      # profile, and the project's own lock and config hashes. Two rules hold:
      #   * a `_build` cache has NO `restore-keys`. A partial restore across a
      #     changed mix.lock is the stale-compiled-artifact footgun; a cold
      #     build is cheaper than a wrong one.
      #   * every cached job runs `rm -rf "_build/${MIX_ENV:?}/lib/threadline"`
      #     (the example removes both of its own apps) after the deps compile
      #     and before the save and the compile, so the cache holds only
      #     dependencies and never serves a stale copy of the code under test.
      # Keys, logs and the poisoned-cache runbook: CONTRIBUTING.md,
      # `### Dependency build cache`.
      #
      # FORWARD REQUIREMENT FOR PHASE 199 (dialyzer PLT cache) — do not build a
      # key shape 199 has to redo. The PLT key must ADDITIONALLY include:
      #   * `hashFiles('mix.exs')` — mix.exs is where `plt_add_apps` for the
      #     optional dependencies lives, so a PLT built before that list changed
      #     is wrong, not merely stale.
      #   * the OTP version — PLTs are not portable across OTP.
      # Unlike `_build`, PLT `restore-keys` ARE correct: PLTs update
      # incrementally, so a near-miss restore is a genuine speedup.
      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix verify.format

  verify-deps-audit:
    name: Dependency audit (Mix lockfiles)
    runs-on: ubuntu-24.04
    # Measured locally: `mix verify.deps_audit` ~13s + `bin/verify-deps-audit
    # --self-test` ~4s = ~17s combined wall time. 10 minutes is the repo's
    # timeout floor and gives well over 4x headroom on a slower hosted runner
    # without hiding a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      # Deliberately NO `deps` cache here. The gate fetches three separate
      # projects' dependencies itself (root, bench, examples/threadline_phoenix)
      # via bin/verify-deps-audit, so a single cached `deps/` directory would add
      # an unverified key shape to the CACHE KEY CONTRACT above while restoring
      # nothing all three fetches actually use.
      - name: Audit root, bench and example lockfiles
        run: mix verify.deps_audit

      - name: Prove the gate goes red (vulnerable lock, old Hex)
        run: bin/verify-deps-audit --self-test

  verify-compile-no-optional:
    name: Compile without optional deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install dependencies
        run: mix deps.get

      - name: Compile without optional deps (warnings-as-errors)
        run: mix verify.compile_no_optional

      - name: Compile bench project (bare mix compile)
        run: mix verify.bench_compile

  verify-hex-evaluator:
    name: Hex package install (rehearsal registry)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DB_HOST: localhost
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Ensure hex_evaluator_test database exists
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h "$DB_HOST" -U postgres hex_evaluator_test 2>/dev/null || true

      - name: Install this tree's package from a local registry and test it
        run: mix verify.hex_evaluator

  verify-pgbouncer-topology:
    name: Tests through PgBouncer (transaction mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadline_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/threadline_test
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_CLIENT_CONN: 200
          DEFAULT_POOL_SIZE: 5
        ports:
          - 6432:5432
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore deps-only build cache
        id: build-restore
        uses: actions/cache/restore@v5
        with:
          path: _build/${{ env.MIX_ENV }}
          key: ubuntu-24.04-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-build-v1-root-${{ env.MIX_ENV }}-full-${{ hashFiles('mix.lock') }}-${{ hashFiles('config/**/*.exs') }}

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies on build cache miss
        if: steps.build-restore.outputs.cache-hit != 'true'
        run: mix deps.compile

      - name: Remove own build (never cached, never reused)
        env:
          BUILD_KEY: ${{ steps.build-restore.outputs.cache-primary-key }}
          BUILD_HIT: ${{ steps.build-restore.outputs.cache-hit }}
        run: |
          if [ "$BUILD_HIT" = "true" ]; then state=hit; else state=miss; fi
          echo "THREADLINE_BUILD_CACHE=${state} key=${BUILD_KEY}"
          rm -rf "_build/${MIX_ENV:?}/lib/threadline"

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Wait for Postgres and PgBouncer
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
          until pg_isready -h localhost -p 6432 -U postgres; do sleep 1; done

      - name: Bootstrap test DB (direct Postgres, bypass pooler)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          THREADLINE_TOPOLOGY_BOOTSTRAP: "1"
        run: mix run priv/ci/topology_bootstrap.exs

      - name: Topology tests + verify_coverage through PgBouncer
        env:
          DB_HOST: localhost
          DB_PORT: "6432"
          THREADLINE_PGBOUNCER_TOPOLOGY: "1"
        run: |
          mix verify.topology
          mix verify.threadline

  verify-credo:
    name: Credo (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Credo
        run: mix verify.credo

  verify-bump-rehearsal:
    name: Next-minor release rehearsal (docs + contracts)
    runs-on: ubuntu-24.04
    # Measured at 66s wall locally (macOS, 295% CPU) for the full run: throwaway
    # clone, deps.get, mix release.pins, the doc-contract tests it derives by
    # filename, verify.release (which builds ExDoc and the Hex tarball). 15 gives
    # roughly 4x headroom on a slower 2-core hosted runner without hiding a hang.
    timeout-minutes: 15
    env:
      DB_HOST: localhost
    services:
      # The rehearsal runs the doc-contract files it derives by filename, plus
      # verify.release and the release contract tests, and test/test_helper.exs
      # creates and migrates the test database on boot. No database means no
      # rehearsal, which this gate scores as a failure rather than a pass.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # fetch-depth: 0 because bin/verify-bump-rehearsal clones this checkout
      # into a throwaway tree. A depth-1 checkout would make that clone shallow
      # and couple the gate to git's shallow-source behaviour for no benefit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      # Deliberately NO `deps` cache here. The rehearsal fetches dependencies
      # inside its own throwaway clone, so this job's `deps/` directory is never
      # populated or read — a cache entry keyed on it would restore nothing that
      # is used, while adding a key shape to the CACHE KEY CONTRACT above that
      # nothing verifies. A cold dependency fetch inside the clone is the honest
      # cost of rehearsing a fresh release checkout.
      - name: Rehearse the next minor bump
        run: mix verify.bump_rehearsal

  verify-dialyzer:
    name: Dialyzer (full optional build)
    runs-on: ubuntu-24.04
    # Plan 199-14 measured the cold job at 252 seconds. The live Dialyzer slice
    # proof (plan 218-03) adds a test-env compile (47 s), the Postgres service
    # init (23 s), both from the current lane of the verify-test job of run
    # 36258719902, and the live test itself (about 10 s, an estimate): 80 s.
    # A 2x headroom factor, rounded up to the next whole minute, gives
    # ceil((252 + 80) * 2 / 60) = 12.
    timeout-minutes: 12
    env:
      MIX_ENV: dev
      DB_HOST: localhost
      DB_PORT: 5432
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-

      - name: Restore Dialyzer PLT
        id: dialyzer-plt-restore
        uses: actions/cache/restore@v5
        with:
          path: .dialyzer
          key: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-dialyzer-plt-${{ hashFiles('mix.lock') }}-${{ hashFiles('mix.exs') }}
          restore-keys: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-dialyzer-plt-

      # Dependency work is deliberately outside both GNU time measurements.
      - name: Install dependencies
        run: mix deps.get

      - name: Compile full optional build
        run: mix compile --warnings-as-errors

      - name: Build and measure Dialyzer PLT on cache miss
        if: steps.dialyzer-plt-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          time_file="${RUNNER_TEMP}/dialyzer-plt-time.txt"
          dialyzer_status=0
          /usr/bin/time -v -o "$time_file" mix dialyzer --plt || dialyzer_status=$?

          wall_count=$(grep -c 'Elapsed (wall clock) time' "$time_file" || true)
          rss_count=$(grep -c 'Maximum resident set size (kbytes)' "$time_file" || true)
          wall_raw=$(sed -n 's/^[[:space:]]*Elapsed (wall clock) time (h:mm:ss or m:ss):[[:space:]]*//p' "$time_file")
          max_rss_kb=$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes):[[:space:]]*//p' "$time_file")
          wall_seconds=$(awk -F: '
            NF == 2 { printf "%.2f", ($1 * 60) + $2; found = 1 }
            NF == 3 { printf "%.2f", ($1 * 3600) + ($2 * 60) + $3; found = 1 }
            END { if (!found) exit 1 }
          ' <<< "$wall_raw") || {
            echo "::error::Unable to parse GNU time output for Dialyzer PLT wall time"
            cat "$time_file"
            exit 1
          }

          if [[ "$wall_count" -ne 1 || "$rss_count" -ne 1 ]] ||
             ! [[ "$wall_seconds" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
             ! [[ "$max_rss_kb" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse GNU time output for Dialyzer PLT measurements"
            cat "$time_file"
            exit 1
          fi

          echo "THREADLINE_DIALYZER_PLT_CACHE=miss"
          echo "THREADLINE_DIALYZER_PLT_WALL_SECONDS=${wall_seconds}"
          echo "THREADLINE_DIALYZER_PLT_MAX_RSS_KB=${max_rss_kb}"
          exit "$dialyzer_status"

      # Save a successfully built/updated PLT before analysis so an analyzer
      # warning cannot discard the expensive, valid cache artifact.
      - name: Save Dialyzer PLT
        if: steps.dialyzer-plt-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .dialyzer
          key: ${{ steps.dialyzer-plt-restore.outputs.cache-primary-key }}

      - name: Report exact PLT cache hit
        if: steps.dialyzer-plt-restore.outputs.cache-hit == 'true'
        run: echo "THREADLINE_DIALYZER_PLT_CACHE=hit"

      - name: Analyze and measure with Dialyzer
        shell: bash
        run: |
          set -euo pipefail
          time_file="${RUNNER_TEMP}/dialyzer-analysis-time.txt"
          dialyzer_status=0
          /usr/bin/time -v -o "$time_file" mix dialyzer --no-check || dialyzer_status=$?

          wall_count=$(grep -c 'Elapsed (wall clock) time' "$time_file" || true)
          rss_count=$(grep -c 'Maximum resident set size (kbytes)' "$time_file" || true)
          wall_raw=$(sed -n 's/^[[:space:]]*Elapsed (wall clock) time (h:mm:ss or m:ss):[[:space:]]*//p' "$time_file")
          max_rss_kb=$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes):[[:space:]]*//p' "$time_file")
          wall_seconds=$(awk -F: '
            NF == 2 { printf "%.2f", ($1 * 60) + $2; found = 1 }
            NF == 3 { printf "%.2f", ($1 * 3600) + ($2 * 60) + $3; found = 1 }
            END { if (!found) exit 1 }
          ' <<< "$wall_raw") || {
            echo "::error::Unable to parse GNU time output for Dialyzer analysis wall time"
            cat "$time_file"
            exit 1
          }

          if [[ "$wall_count" -ne 1 || "$rss_count" -ne 1 ]] ||
             ! [[ "$wall_seconds" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
             ! [[ "$max_rss_kb" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse GNU time output for Dialyzer analysis measurements"
            cat "$time_file"
            exit 1
          fi

          echo "THREADLINE_DIALYZER_ANALYSIS_WALL_SECONDS=${wall_seconds}"
          echo "THREADLINE_DIALYZER_ANALYSIS_MAX_RSS_KB=${max_rss_kb}"
          exit "$dialyzer_status"

      # Runs after the PLT restore/build/save above, so the analysis it shells out
      # to has a real PLT. bin/verify-dialyzer-slice fails closed when Dialyzer did
      # not complete (a missing or unreadable PLT can no longer read as
      # "0 live warnings"). This is the only job that runs the `live_dialyzer` tag;
      # test/test_helper.exs excludes it from default `mix test`.
      - name: Live Dialyzer slice proof (fails closed)
        env:
          MIX_ENV: test
        run: mix verify.dialyzer_slice

  verify-test:
    # Base axis `lane` drives the check-name suffix → GitHub posts exactly
    # "Build and test (min)", "Build and test (current)" and
    # "Build and test (latest)". Keys carried only via `include`
    # (elixir/otp/pg/runner) do NOT append to that suffix, so the static
    # `name:` yields the three documented check names (D-15/D-19, RESEARCH
    # M1 construction A). Min lane = Elixir 1.15.8 / OTP 26.2.5.21 (exact
    # floor build, strict) / pg15 on ubuntu-24.04 proving the declared floor;
    # current lane = the committed .tool-versions build, the full payload.
    # Latest lane = the newest stable Elixir/OTP/PostgreSQL, exactly pinned
    # with explicit `otp`/`elixir` (no `version-file`); it runs compile
    # --warnings-as-errors, xref cycles and the partitioned `mix
    # verify.test_partitioned` step only (every
    # current-only step guards on `matrix.lane == 'current'`), votes through
    # `ci-required` on every run (Phase 220 D-07; Phase 222 may trim it), and
    # is re-pinned at each milestone close. It is tested-on evidence, not a
    # support floor. Each row sets exactly one toolchain source — the min and
    # latest rows their explicit pins, the current row `version-file` —
    # because setup-beam errors when both are set and an absent matrix key
    # renders as an empty input.
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        lane: [min, current, latest]
        include:
          - lane: min
            elixir: "1.15.8"
            otp: "26.2.5.21"
            pg: "15"
            runner: "ubuntu-24.04"
          - lane: current
            version-file: ".tool-versions"
            pg: "16"
            runner: "ubuntu-24.04"
          - lane: latest
            elixir: "1.20.4"
            otp: "29.1.1"
            pg: "18.6"
            runner: "ubuntu-24.04"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DB_HOST: localhost
      MIX_ENV: test
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: ${{ matrix.version-file }}
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          version-type: strict

      - name: Restore deps-only build cache
        id: build-restore
        uses: actions/cache/restore@v5
        with:
          path: _build/${{ env.MIX_ENV }}
          key: ${{ matrix.runner }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-build-v1-root-${{ env.MIX_ENV }}-full-${{ hashFiles('mix.lock') }}-${{ hashFiles('config/**/*.exs') }}

      # THE bug this key shape fixes (D-19): an older key led with the
      # OS-family context value of the runner, which resolves to the literal
      # string `Linux` on every ubuntu image and carries no OTP or Elixir at
      # all. The min lane, then on an older ubuntu image, and the current lane
      # therefore shared ONE cache entry — the min lane could be "verified"
      # against dependencies compiled for current, which is a false green on
      # the Elixir 1.15 floor promise, not merely a slow build. Today the key
      # also carries the resolved OTP/Elixir, so the min, current and latest
      # lanes cannot collide even on the same image: each lane restores and
      # saves its own root key (four build keys across six job-lanes).
      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ matrix.runner }}-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ matrix.runner }}-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies on build cache miss
        if: steps.build-restore.outputs.cache-hit != 'true'
        run: mix deps.compile

      - name: Remove own build (never cached, never reused)
        env:
          BUILD_KEY: ${{ steps.build-restore.outputs.cache-primary-key }}
          BUILD_HIT: ${{ steps.build-restore.outputs.cache-hit }}
        run: |
          if [ "$BUILD_HIT" = "true" ]; then state=hit; else state=miss; fi
          echo "THREADLINE_BUILD_CACHE=${state} key=${BUILD_KEY}"
          rm -rf "_build/${MIX_ENV:?}/lib/threadline"

      - name: Save deps-only build cache
        if: steps.build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: _build/${{ env.MIX_ENV }}
          key: ${{ steps.build-restore.outputs.cache-primary-key }}

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Verify no compile-connected xref cycles
        run: mix verify.xref_cycles

      # SUITE-02 runtime mutation control (D-10): proves the partitioned gate
      # goes red on a failing partition, through the documented test-only
      # seam in bin/ci-test-partitions. Unconditional on every lane, runs
      # before the real "Run tests" step.
      - name: Prove the gate goes red (failing partition)
        run: bin/ci-test-partitions --self-test

      # SUITE-02: N concurrent `mix test <files>` processes (test files split
      # by measured weight, test/partition_weights.txt), each on its own
      # threadline_test<i> database (config/test.exs), aggregated by
      # bin/ci-test-partitions. The local default stays whole and
      # unpartitioned (`mix verify.test`, CONTRIBUTING.md).
      - name: Run tests
        run: mix verify.test_partitioned

      # The partitioned "Run tests" step above no longer migrates the
      # unsuffixed threadline_test database (each partition only migrates its
      # own threadline_test<i>). Pointing this step at partition 1's database
      # reuses a database the test run already created and migrated, with no
      # added wall-clock cost (D-07).
      - name: Verify Threadline trigger coverage
        if: matrix.lane == 'current'
        env:
          MIX_TEST_PARTITION: "1"
        run: mix verify.threadline

      - name: Ensure threadline_phoenix_test database exists (threadline on search_path)
        if: matrix.lane == 'current'
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h "$DB_HOST" -U postgres threadline_phoenix_test 2>/dev/null || true
          # The audit tables live in the dedicated `threadline` schema; the demo
          # seed queries them unqualified, so `threadline` must be on the DB
          # search_path (nothing in app config or a migration sets it). This
          # statement is deliberately confined to the example-app database —
          # never applied to the root library's own `threadline_test` database.
          psql -h "$DB_HOST" -U postgres -d threadline_phoenix_test \
            -c "ALTER DATABASE threadline_phoenix_test SET search_path TO \"\$user\", public, threadline;"

      - name: Restore example deps and deps-only build cache
        id: example-build-restore
        if: matrix.lane == 'current'
        uses: actions/cache/restore@v5
        with:
          path: |
            examples/threadline_phoenix/deps
            examples/threadline_phoenix/_build/${{ env.MIX_ENV }}
          key: ${{ matrix.runner }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-build-v1-example-${{ env.MIX_ENV }}-full-${{ hashFiles('examples/threadline_phoenix/mix.lock') }}-${{ hashFiles('examples/threadline_phoenix/config/**/*.exs') }}

      - name: Install example dependencies
        if: matrix.lane == 'current'
        working-directory: examples/threadline_phoenix
        run: mix deps.get

      - name: Compile example dependencies on cache miss
        if: matrix.lane == 'current' && steps.example-build-restore.outputs.cache-hit != 'true'
        working-directory: examples/threadline_phoenix
        run: mix deps.compile --skip-local-deps

      - name: Remove example app's own build (never cached, never reused)
        env:
          EXAMPLE_BUILD_KEY: ${{ steps.example-build-restore.outputs.cache-primary-key }}
          EXAMPLE_BUILD_HIT: ${{ steps.example-build-restore.outputs.cache-hit }}
        run: |
          if [ -n "$EXAMPLE_BUILD_KEY" ]; then
            if [ "$EXAMPLE_BUILD_HIT" = "true" ]; then state=hit; else state=miss; fi
            echo "THREADLINE_EXAMPLE_BUILD_CACHE=${state} key=${EXAMPLE_BUILD_KEY}"
          fi
          rm -rf "examples/threadline_phoenix/_build/${MIX_ENV:?}/lib/threadline" \
            "examples/threadline_phoenix/_build/${MIX_ENV:?}/lib/threadline_phoenix"

      - name: Save example deps and deps-only build cache
        if: matrix.lane == 'current' && steps.example-build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            examples/threadline_phoenix/deps
            examples/threadline_phoenix/_build/${{ env.MIX_ENV }}
          key: ${{ steps.example-build-restore.outputs.cache-primary-key }}

      - name: Verify Threadline Phoenix example
        if: matrix.lane == 'current'
        run: mix verify.example

  # Removed: verify-mechanical (mix verify.mechanical over the committed scorecards).
  # Failure class "a committed scorecard breaches MODE-A/MODE-B" is still caught by
  # verify-test (min and current lanes), which runs mechanical_checker_test.exs in
  # the default suite, on push to main, pull_request and workflow_dispatch.

  # Heavy recurring gate: regenerate the Tier A capture from scratch against a
  # migrated example DB + real browser, and assert (1) the evidence bundle is
  # non-empty and complete (every aria.yml has a matching scorecard JSON) and
  # (2) regeneration is byte-stable against the committed evidence (no drift).
  # This is the recurring proof of the two former human-UAT items (194-UAT.md).
  verify-capture:
    name: Capture evidence byte-stable
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/threadline_phoenix/e2e/package-lock.json

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-24.04-playwright-${{ hashFiles('examples/threadline_phoenix/e2e/package-lock.json') }}
          restore-keys: ubuntu-24.04-playwright-

      - name: Install root dependencies
        run: mix deps.get

      - name: Ensure threadline_phoenix_test database exists (threadline on search_path)
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h "$DB_HOST" -U postgres threadline_phoenix_test 2>/dev/null || true
          # The audit tables live in the dedicated `threadline` schema; the demo
          # seed queries them unqualified, so `threadline` must be on the DB
          # search_path (nothing in app config or a migration sets it).
          psql -h "$DB_HOST" -U postgres -d threadline_phoenix_test \
            -c "ALTER DATABASE threadline_phoenix_test SET search_path TO \"\$user\", public, threadline;"

      - name: Restore example deps and deps-only build cache
        id: example-build-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            examples/threadline_phoenix/deps
            examples/threadline_phoenix/_build/${{ env.MIX_ENV }}
          key: ubuntu-24.04-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-build-v1-example-${{ env.MIX_ENV }}-full-${{ hashFiles('examples/threadline_phoenix/mix.lock') }}-${{ hashFiles('examples/threadline_phoenix/config/**/*.exs') }}

      - name: Install example dependencies
        working-directory: examples/threadline_phoenix
        run: mix deps.get

      - name: Compile example dependencies on cache miss
        if: steps.example-build-restore.outputs.cache-hit != 'true'
        working-directory: examples/threadline_phoenix
        run: mix deps.compile --skip-local-deps

      - name: Remove example app's own build (never cached, never reused)
        env:
          EXAMPLE_BUILD_KEY: ${{ steps.example-build-restore.outputs.cache-primary-key }}
          EXAMPLE_BUILD_HIT: ${{ steps.example-build-restore.outputs.cache-hit }}
        run: |
          if [ -n "$EXAMPLE_BUILD_KEY" ]; then
            if [ "$EXAMPLE_BUILD_HIT" = "true" ]; then state=hit; else state=miss; fi
            echo "THREADLINE_EXAMPLE_BUILD_CACHE=${state} key=${EXAMPLE_BUILD_KEY}"
          fi
          rm -rf "examples/threadline_phoenix/_build/${MIX_ENV:?}/lib/threadline" \
            "examples/threadline_phoenix/_build/${MIX_ENV:?}/lib/threadline_phoenix"

      - name: Save example deps and deps-only build cache
        if: steps.example-build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            examples/threadline_phoenix/deps
            examples/threadline_phoenix/_build/${{ env.MIX_ENV }}
          key: ${{ steps.example-build-restore.outputs.cache-primary-key }}

      - name: Regenerate Tier A capture
        run: mix verify.capture

      - name: Assert complete evidence bundle (non-empty, every aria.yml has a matching scorecard)
        run: |
          json=$(find test/fixtures/operator_surface/scorecards -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')
          aria=$(find test/fixtures/operator_surface/scorecards -maxdepth 1 -name '*.aria.yml' | wc -l | tr -d ' ')
          echo "scorecards: ${json} json, ${aria} aria.yml"
          # Non-vacuity floor: a zero count means the capture produced nothing,
          # which a broken glob or an aborted run would also produce.
          if [ "$json" -eq 0 ]; then
            echo "::error::a zero scorecard JSON count means the capture produced nothing"
            exit 1
          fi
          if [ "$aria" -eq 0 ]; then
            echo "::error::a zero aria.yml count means the capture produced nothing"
            exit 1
          fi
          # Completeness: this is what "complete bundle" actually means, and it
          # stays true at any bundle size (unlike a pinned absolute count).
          missing=""
          for f in test/fixtures/operator_surface/scorecards/*.aria.yml; do
            stem=$(basename "$f" .aria.yml)
            if [ ! -f "test/fixtures/operator_surface/scorecards/${stem}.json" ]; then
              missing="${missing} ${stem}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::orphan aria.yml with no matching scorecard JSON:${missing}"
            exit 1
          fi

      - name: Assert byte-stable regeneration (no drift from committed evidence)
        run: |
          if [ -n "$(git status --porcelain test/fixtures/operator_surface/scorecards/)" ]; then
            echo "::error::Tier A capture is not byte-stable, or committed evidence is stale."
            echo "Regenerate locally with 'mix verify.capture' and commit the result."
            git status --porcelain test/fixtures/operator_surface/scorecards/
            git diff -- test/fixtures/operator_surface/scorecards/ | head -200
            exit 1
          fi
          echo "Regeneration is byte-identical to the committed evidence."

      # Removed: the trailing `mix verify.mechanical` step. Failure class
      # "regenerated evidence breaches a MODE-A/MODE-B rule" is still caught by the
      # byte-stable step above (regenerated == committed) plus verify-test running
      # mechanical_checker_test.exs over the committed JSON, on push to main,
      # pull_request and workflow_dispatch.

  verify-example-browser:
    name: Example app browser E2E (2 projects)
    runs-on: ubuntu-24.04
    # 18 is a BUDGET (D-16), not a multiple of an observed green p95 — this lane
    # has no observed green duration to size against. Its two recorded runs are
    # 1h33m38s while systemically broken (run 28214113903) and 2m04s while
    # fast-failing (run 33113148222). 18 is therefore a deliberate ceiling: it
    # will fail a lane that regresses back toward the 1h33m case rather than
    # silently absorbing it. Re-derive from a real green run when one exists.
    timeout-minutes: 18
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/threadline_phoenix/e2e/package-lock.json

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ubuntu-24.04-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-deps-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-24.04-playwright-${{ hashFiles('examples/threadline_phoenix/e2e/package-lock.json') }}
          restore-keys: ubuntu-24.04-playwright-

      - name: Install root dependencies
        run: mix deps.get

      - name: Ensure threadline_phoenix_test database exists
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h "$DB_HOST" -U postgres threadline_phoenix_test 2>/dev/null || true
          # The audit tables live in the dedicated `threadline` schema; the demo
          # seed queries them unqualified, so `threadline` must be on the DB
          # search_path (nothing in app config or a migration sets it).
          psql -h "$DB_HOST" -U postgres -d threadline_phoenix_test \
            -c "ALTER DATABASE threadline_phoenix_test SET search_path TO \"\$user\", public, threadline;"

      - name: Restore example deps and deps-only build cache
        id: example-build-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            examples/threadline_phoenix/deps
            examples/threadline_phoenix/_build/${{ env.MIX_ENV }}
          key: ubuntu-24.04-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-build-v1-example-${{ env.MIX_ENV }}-full-${{ hashFiles('examples/threadline_phoenix/mix.lock') }}-${{ hashFiles('examples/threadline_phoenix/config/**/*.exs') }}

      - name: Install example dependencies
        working-directory: examples/threadline_phoenix
        run: mix deps.get

      - name: Compile example dependencies on cache miss
        if: steps.example-build-restore.outputs.cache-hit != 'true'
        working-directory: examples/threadline_phoenix
        run: mix deps.compile --skip-local-deps

      - name: Remove example app's own build (never cached, never reused)
        env:
          EXAMPLE_BUILD_KEY: ${{ steps.example-build-restore.outputs.cache-primary-key }}
          EXAMPLE_BUILD_HIT: ${{ steps.example-build-restore.outputs.cache-hit }}
        run: |
          if [ -n "$EXAMPLE_BUILD_KEY" ]; then
            if [ "$EXAMPLE_BUILD_HIT" = "true" ]; then state=hit; else state=miss; fi
            echo "THREADLINE_EXAMPLE_BUILD_CACHE=${state} key=${EXAMPLE_BUILD_KEY}"
          fi
          rm -rf "examples/threadline_phoenix/_build/${MIX_ENV:?}/lib/threadline" \
            "examples/threadline_phoenix/_build/${MIX_ENV:?}/lib/threadline_phoenix"

      - name: Save example deps and deps-only build cache
        if: steps.example-build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            examples/threadline_phoenix/deps
            examples/threadline_phoenix/_build/${{ env.MIX_ENV }}
          key: ${{ steps.example-build-restore.outputs.cache-primary-key }}

      # Reduced pull-request lane (Phase 198, D-17). Runs ONLY the two
      # interactive Chromium projects. The remaining projects (the capture
      # lanes) run on push-to-main and nightly in browser-full.yml, which is
      # deliberately NOT part of `ci-required`. This is a real coverage/latency
      # trade, not a free win: what moved is stated verbatim in CONTRIBUTING.md
      # under "## CI Coverage" and asserted by
      # test/threadline/ci_coverage_doc_contract_test.exs.
      #
      # The branch-protection context is `CI required` alone. This job's `name:`
      # is free to change and is pinned only by the phase 221 name contract
      # (`@ci_check_names`); it votes through `ci-required`'s needs list.
      # Strictly less than the job-level 18 so the STEP fails first — a job-level
      # timeout kills the runner outright and the failure-artifact upload below
      # never executes. 14 < 18 keeps the diagnosis path alive.
      - name: Run example Playwright suite
        timeout-minutes: 14
        run: mix verify.example_browser --project=desktop-chromium --project=mobile-chromium

      # Diagnosis half of D-18. maxFailures aborts the run after 5 failures, so
      # this step is what makes that abort useful: it preserves the retained
      # traces (playwright.config.ts `trace: "retain-on-failure"`) for the
      # failures that DID occur, plus the phx.server boot log that explains a
      # preflight abort. Ordered AFTER the Playwright step and guarded on
      # failure() so it runs precisely when the run died early.
      - name: Upload Playwright traces and e2e boot log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: example-browser-e2e-diagnostics
          path: |
            examples/threadline_phoenix/e2e/test-results
            examples/threadline_phoenix/e2e/playwright-report
            /tmp/threadline_phoenix_e2e.log
          if-no-files-found: warn
          retention-days: 14

  # The single required status check on `main` (D-08). Collapses every job above
  # into one pass/fail signal so branch protection names one context, not thirteen,
  # and so no required-check name carries a matrix axis that could rot.
  #
  # `if: always()` is load-bearing (D-09): a job that `needs:` a FAILED job is
  # itself marked *skipped*, and GitHub scores a skipped required check as
  # PASSING. Without `always()` this gate would go green on exactly the failures
  # it exists to catch. `jobs: ${{ toJSON(needs) }}` then inspects every result
  # value (success|failure|cancelled|skipped) rather than grepping result
  # strings — do NOT replace it with a hand-rolled result-string containment
  # expression over the needs results, which scores skipped-on-dependency-
  # failure as a pass.
  ci-required:
    name: CI required
    if: always()
    needs:
      - verify-format
      - verify-credo
      - verify-dialyzer
      - verify-compile-no-optional
      - verify-test
      - verify-hex-evaluator
      - verify-example-browser
      - verify-capture
      - verify-pgbouncer-topology
      - verify-release-shape
      - verify-bump-rehearsal
      - verify-deps-audit
      - verify-repo-hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Decide whether all needed jobs succeeded
        # v1.2.2 / release/v1, pinned so the sole required-check decision cannot
        # change without a reviewed repository commit.
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35
        with:
          jobs: ${{ toJSON(needs) }}
          # Extension point: the first `needs:` job that becomes conditionally
          # skipped (a job-level `if:`) must be listed here via `allowed-skips`,
          # or this gate will correctly fail on its skip. Deliberately absent
          # today — all thirteen jobs above run unconditionally, so neither
          # `allowed-skips` nor `allowed-failures` applies yet.
