# Daily, non-required dependency health lane (SUP-04). Deliberately NOT a
# member of ci.yml or ci-required's needs: — this lane never blocks a pull
# request. It runs `mix hex.audit --format sarif` over all three lockfiles
# this repo maintains (root, bench, examples/threadline_phoenix) and
# classifies the run as clean, unknown, retirement or advisory. Any non-clean
# class opens or updates exactly ONE open issue labelled `ci-deps` (a re-run
# comments on, and retitles, the same issue rather than opening a second
# one); only a clean run closes it. The policy this lane implements is
# documented in CONTRIBUTING.md's "Dependency freshness policy" section, and
# test/threadline/deps_health_doc_contract_test.exs derives facts from this
# workflow and fails if that section drifts.
#
# Job id is stable (relied on by docs/CI conventions); evolve `name:` freely.
name: Dependency Health

on:
  workflow_dispatch:
  schedule:
    # Daily 08:00 UTC, so a new advisory reaches the issue within a day.
    - cron: "0 8 * * *"
  # A lockfile change on main re-runs the lane, so the issue closes as soon
  # as a fix lands. Exactly the three mix.exs/mix.lock pairs.
  push:
    branches: [main]
    paths:
      - mix.exs
      - mix.lock
      - bench/mix.exs
      - bench/mix.lock
      - examples/threadline_phoenix/mix.exs
      - examples/threadline_phoenix/mix.lock

permissions:
  contents: read

concurrency:
  group: deps-health
  cancel-in-progress: false

jobs:
  # Job id is stable.
  deps-health:
    name: Daily hex.audit (Mix lockfiles)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict
          install-hex: false

      - name: Pin Hex (CI and local must agree)
        run: bin/retry-network mix local.hex 2.6.0 --force

      # The report step also re-proves every SHA-pinned action ref against its
      # `# vX.Y.Z` tag (bin/verify-action-pins, read-only GitHub API calls, so
      # it needs GH_TOKEN). A mismatch or an unverifiable pin makes the run
      # `unknown`, with the reason at the top of the report. PR CI never runs
      # this check. The job's permissions are unchanged.
      - name: Classify hex.audit over all three lockfiles
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/deps-health-report "$RUNNER_TEMP/deps-health"

      # `if: always() && ...` gates on the classification VALUE rather than
      # the implicit success of everything before it, so a future step
      # inserted between `report` and here cannot silently re-skip issue
      # filing (same idiom as flake-detection.yml's own upsert step). An
      # empty or crashed report step still has `classification` default to
      # the empty string, which is not 'clean', so this still fires.
      - name: Open or update the dependency health issue
        if: always() && steps.report.outputs.classification != 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE_PREFIX: "Dependency health"
          LABEL: ci-deps
          CLASSIFICATION: ${{ steps.report.outputs.classification }}
          REPORT_FILE: ${{ steps.report.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -n "${REPORT_FILE:-}" ] && [ -f "$REPORT_FILE" ]; then
            body_file="$REPORT_FILE"
          else
            # The report step crashed before producing a file (or
            # $GITHUB_OUTPUT never received `report=...`). Never go silent:
            # file a fallback body saying so, with the run URL attached.
            body_file=$(mktemp)
            trap 'rm -f "$body_file"' EXIT
            cat > "$body_file" <<EOF
          Classification: unknown (the report step produced no report file).

          Run: ${RUN_URL}
          Commit: \`${GITHUB_SHA}\` (${GITHUB_EVENT_NAME})

          This issue is reused across runs. Policy: see CONTRIBUTING.md,
          "Dependency freshness policy".
          EOF
          fi

          bin/upsert-ci-issue --marker "$TITLE_PREFIX" \
            --title "$TITLE_PREFIX: ${CLASSIFICATION:-unknown}" \
            --body-file "$body_file" --label "$LABEL" \
            --label-description "Deps-health lane: hex.audit advisories, retirements or an unknown audit state" \
            --label-color FBCA04

      # ECON-02 / D-06: a clean run closes the open dependency health issue,
      # after first commenting with this run's URL and SHA so the closure is
      # attributable. Gated on the classification VALUE 'clean' only: an
      # empty/crashed report (classification '') and an `unknown` result
      # never close. With no open issue the script prints action=none and
      # writes nothing.
      - name: Close the dependency health issue on a clean run
        if: steps.report.outputs.classification == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE_PREFIX: "Dependency health"
          LABEL: ci-deps
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          printf 'Clean on %s (%s): %s\n' "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$RUN_URL" > "$body_file"
          bin/upsert-ci-issue --close --marker "$TITLE_PREFIX" --label "$LABEL" --body-file "$body_file"

      # The lane goes red on every non-clean class: `advisory`, `retirement`
      # or `unknown` (an audit this lane could not vouch for). It exempts only
      # the one known-safe value instead of allow-listing the bad ones, so an
      # empty or crashed report also goes red. The classification reaches the
      # shell through env:, never through expression interpolation in run:.
      - name: Fail the job on any non-clean result
        if: always() && steps.report.outputs.classification != 'clean'
        env:
          CLASSIFICATION: ${{ steps.report.outputs.classification }}
        run: |
          echo "::error::Dependency health classified this run as '${CLASSIFICATION}'. See CONTRIBUTING.md, \"Dependency freshness policy\"."
          exit 1
