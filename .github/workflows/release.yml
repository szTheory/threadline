# Canonical release lane: Release Please (ongoing) or workflow_dispatch bootstrap/recovery.
# Fan-out: gate-ci-green -> publish-hex -> distribution-sync (opens doc PR).
#
# Requires secrets: HEX_API_KEY, optional RELEASE_PLEASE_TOKEN (fine-grained PAT).
# Legacy tag-only path: .github/workflows/hex-publish.yml (fallback; tag pushes from
# GITHUB_TOKEN in this workflow do not fan-out to other workflows).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish from (e.g. v0.6.0). Created on main HEAD if missing."
        required: true
        type: string
      release_version:
        description: "Expected @version in mix.exs (e.g. 0.6.0)."
        required: true
        type: string
      dry_run:
        description: "Run mix hex.publish --dry-run instead of publishing."
        required: false
        type: boolean
        default: false
      skip_distribution_sync:
        description: "Skip opening the post-publish distribution doc PR."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

# No workflow-level concurrency group: the frequent release-please bookkeeping job
# must stay independent and never queue behind a long-running publish. Publish-race
# serialization is scoped to the publish-hex job (see its job-level `concurrency`).

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
      tag_name: ${{ steps.release.outputs.tag_name || '' }}
      version: ${{ steps.release.outputs.version || '' }}
      sha: ${{ steps.release.outputs.sha || '' }}
      prs_created: ${{ steps.release.outputs.prs_created || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect already-tagged release PR
        id: release-preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          pr_number=""
          if [[ "${COMMIT_MESSAGE:-}" =~ Merge\ pull\ request\ #([0-9]+) ]]; then
            pr_number="${BASH_REMATCH[1]}"
          fi

          if [ -z "$pr_number" ]; then
            echo "should_run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          labels=$(gh pr view "$pr_number" --json labels --jq '.labels[].name' 2>/dev/null || true)
          if grep -qx 'autorelease: tagged' <<<"$labels"; then
            echo "should_run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          expected_tag="v$(jq -r '.["."]' .release-please-manifest.json)"
          if gh release view "$expected_tag" >/dev/null 2>&1; then
            echo "should_run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >>"$GITHUB_OUTPUT"

      - name: Run Release Please
        id: release
        if: steps.release-preflight.outputs.should_run == 'true'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  bootstrap-release-pr-ci:
    name: Bootstrap CI on Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: release-please
    if: github.event_name == 'push' && needs.release-please.outputs.prs_created == 'true'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch CI on release PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref release-please--branches--main -R "${{ github.repository }}"

  dispatch-bootstrap:
    name: Bootstrap release ref (dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      checkout_ref: ${{ steps.bootstrap.outputs.checkout_ref }}
      release_sha: ${{ steps.bootstrap.outputs.release_sha }}
      release_version: ${{ steps.bootstrap.outputs.release_version }}
      release_tag: ${{ steps.bootstrap.outputs.release_tag }}
      dry_run: ${{ steps.bootstrap.outputs.dry_run }}
      skip_distribution_sync: ${{ steps.bootstrap.outputs.skip_distribution_sync }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve tag and create if missing
        id: bootstrap
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          DISPATCH_VERSION: ${{ github.event.inputs.release_version }}
          DISPATCH_DRY: ${{ github.event.inputs.dry_run }}
          DISPATCH_SKIP_SYNC: ${{ github.event.inputs.skip_distribution_sync }}
        run: |
          set -euo pipefail
          tag="$DISPATCH_TAG"
          version="$DISPATCH_VERSION"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          if [[ "${tag#v}" != "$version" ]]; then
            echo "tag $tag implies ${tag#v} but release_version is $version" >&2
            exit 1
          fi

          git fetch origin main --tags

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            sha="$(git rev-list -n 1 "$tag")"
          else
            sha="$(git rev-parse origin/main)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag" "$sha"
            git push origin "$tag"
          fi

          echo "checkout_ref=$tag" >>"$GITHUB_OUTPUT"
          echo "release_sha=$sha" >>"$GITHUB_OUTPUT"
          echo "release_version=$version" >>"$GITHUB_OUTPUT"
          echo "release_tag=$tag" >>"$GITHUB_OUTPUT"
          echo "dry_run=$DISPATCH_DRY" >>"$GITHUB_OUTPUT"
          echo "skip_distribution_sync=$DISPATCH_SKIP_SYNC" >>"$GITHUB_OUTPUT"

  release-ref:
    name: Select release ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [release-please, dispatch-bootstrap]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && needs.dispatch-bootstrap.result == 'success') ||
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
      )
    outputs:
      checkout_ref: ${{ steps.select.outputs.checkout_ref }}
      release_sha: ${{ steps.select.outputs.release_sha }}
      release_version: ${{ steps.select.outputs.release_version }}
      release_tag: ${{ steps.select.outputs.release_tag }}
      dry_run: ${{ steps.select.outputs.dry_run }}
      skip_distribution_sync: ${{ steps.select.outputs.skip_distribution_sync }}
    steps:
      - name: Select outputs from active path
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          RP_VERSION: ${{ needs.release-please.outputs.version }}
          RP_SHA: ${{ needs.release-please.outputs.sha }}
          DB_CHECKOUT: ${{ needs.dispatch-bootstrap.outputs.checkout_ref }}
          DB_SHA: ${{ needs.dispatch-bootstrap.outputs.release_sha }}
          DB_VERSION: ${{ needs.dispatch-bootstrap.outputs.release_version }}
          DB_TAG: ${{ needs.dispatch-bootstrap.outputs.release_tag }}
          DB_DRY: ${{ needs.dispatch-bootstrap.outputs.dry_run }}
          DB_SKIP: ${{ needs.dispatch-bootstrap.outputs.skip_distribution_sync }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "checkout_ref=$DB_CHECKOUT" >>"$GITHUB_OUTPUT"
            echo "release_sha=$DB_SHA" >>"$GITHUB_OUTPUT"
            echo "release_version=$DB_VERSION" >>"$GITHUB_OUTPUT"
            echo "release_tag=$DB_TAG" >>"$GITHUB_OUTPUT"
            echo "dry_run=$DB_DRY" >>"$GITHUB_OUTPUT"
            echo "skip_distribution_sync=$DB_SKIP" >>"$GITHUB_OUTPUT"
          else
            echo "checkout_ref=$RP_TAG" >>"$GITHUB_OUTPUT"
            echo "release_sha=$RP_SHA" >>"$GITHUB_OUTPUT"
            echo "release_version=$RP_VERSION" >>"$GITHUB_OUTPUT"
            echo "release_tag=$RP_TAG" >>"$GITHUB_OUTPUT"
            echo "dry_run=false" >>"$GITHUB_OUTPUT"
            echo "skip_distribution_sync=false" >>"$GITHUB_OUTPUT"
          fi

  gate-ci-green:
    name: Verify CI is green on release SHA
    runs-on: ubuntu-24.04
    # This job is INHERENTLY long-running: the poll below is 60 attempts x 30s
    # = 30 minutes by construction. The bound must sit strictly ABOVE its own
    # poll window or it would truncate a legitimate wait and turn a slow-but-
    # green CI run into a failed release. 45 leaves 15 minutes of headroom for
    # checkout, API latency, and retries; the poll still self-fails at 30.
    timeout-minutes: 45
    needs: release-ref
    if: always() && needs.release-ref.result == 'success'
    steps:
      - name: Wait for ci.yml success on release SHA
        uses: actions/github-script@v8
        with:
          script: |
            const sha = '${{ needs.release-ref.outputs.release_sha }}';
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const maxAttempts = 60;
            const waitMs = 30000;
            let lastRunUrl = '';

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                per_page: 20
              });

              const runs = data.workflow_runs
                .filter((run) => run.head_sha === sha)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (runs.length === 0) {
                core.info(`No ci.yml run yet for ${sha} (${attempt}/${maxAttempts}).`);
                await sleep(waitMs);
                continue;
              }

              lastRunUrl = runs[0].html_url;

              if (runs.some((run) => run.status !== 'completed')) {
                await sleep(waitMs);
                continue;
              }

              const successRun = runs.find((run) => run.conclusion === 'success');
              if (successRun) {
                core.info(`ci.yml succeeded on release SHA ${sha}: ${successRun.html_url}`);
                return;
              }

              await sleep(waitMs);
            }

            core.setFailed(
              `Timed out waiting for green ci.yml on SHA ${sha}. Last run: ${lastRunUrl || 'none'}`
            );

  publish-hex:
    name: Publish to Hex.pm
    runs-on: ubuntu-24.04
    # D-27: a human click in front of the irreversible step. The `production-hex`
    # Environment carries a required-reviewer rule, so this job PAUSES for approval
    # before any publish. Hex.pm offers roughly a one-hour revert window and then a
    # publish is a support request, so a compromised workflow change still cannot
    # ship a release unattended.
    #
    # This gate is added IN FRONT OF the five existing pre-publish gates, never in
    # place of any of them: gate-ci-green (needs:, below), the hard needs:
    # dependency, verify-release-shape + hex.build, the already-published
    # idempotency skip, and post-publish verification. Removing any of those to
    # make a release go green is out of contract.
    environment: production-hex
    # deps.get + hex.build + publish + a 36 x 10s (6 min) Hex-index poll.
    # Note: approval wait time does NOT count against this bound — GitHub starts
    # the job clock after the reviewer approves.
    timeout-minutes: 30
    needs: [release-ref, gate-ci-green]
    if: always() && needs.release-ref.result == 'success' && needs.gate-ci-green.result == 'success'
    # Serialize concurrent publishes on the same ref (no run_id, or this is a no-op).
    # gate-ci-green + the idempotency skip below remain the real publish-race guards.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      published: ${{ steps.publish_state.outputs.published }}
      skipped: ${{ steps.idempotency.outputs.skip || 'false' }}
    env:
      RELEASE_VERSION: ${{ needs.release-ref.outputs.release_version }}
      RELEASE_TAG: ${{ needs.release-ref.outputs.release_tag }}
      DRY_RUN: ${{ needs.release-ref.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-ref.outputs.checkout_ref }}

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.0"

      - name: Install dependencies
        run: mix deps.get

      - name: Confirm tag matches mix.exs @version
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VER="${TAG#v}"
          MIX_VER=$(grep -E '^\s*@version\s+"' mix.exs | head -1 | sed -n 's/.*@version "\([^"]*\)".*/\1/p')
          if [[ "$MIX_VER" != "$VER" ]]; then
            echo "Tag $TAG implies $VER but mix.exs has @version \"$MIX_VER\"" >&2
            exit 1
          fi

      - name: Run release tarball preflight
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          bin/verify-release-shape
          mix hex.build

      - name: Skip if version already on Hex
        id: idempotency
        if: env.DRY_RUN != 'true'
        run: |
          if mix hex.info threadline "${RELEASE_VERSION}" 2>/dev/null | grep -q "Released:"; then
            echo "Version ${RELEASE_VERSION} already on Hex — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Hex.pm
        if: env.DRY_RUN == 'true' || steps.idempotency.outputs.skip != 'true'
        # ---------------------------------------------------------------------
        # HEX AUTHENTICATION — TRUSTED-PUBLISHING SWAP POINT (D-27)
        #
        # Everything between this marker and the END marker is the ONLY place
        # this pipeline authenticates to Hex.pm. It is deliberately one
        # contiguous region so that migrating to Hex trusted publishing / OIDC
        # is a single-block replacement rather than a diff spread across the job.
        #
        # Why a long-lived key is still here: Hex trusted publishing was
        # announced but is not generally available, so the key stays and is
        # MITIGATED rather than pretended away — scoped to publish-only, and
        # reachable only after the `production-hex` required-reviewer approval
        # declared at the top of this job.
        #
        # When Hex ships OIDC, replace this whole block with the OIDC exchange
        # and add `id-token: write` to the job `permissions:`. Do not scatter
        # the replacement; keep it one block so the next swap is as cheap.
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "::error::Set repository secret HEX_API_KEY to enable publish."
            exit 1
          fi
          # --- END HEX AUTHENTICATION SWAP POINT -------------------------------
          if [[ "$DRY_RUN" == "true" ]]; then
            mix hex.publish --dry-run --yes
          else
            mix hex.publish --yes
          fi

      - name: Record publish state
        id: publish_state
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.idempotency.outputs.skip || '' }}" == "true" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version on Hex.pm
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "https://hex.pm/api/packages/threadline/releases/${RELEASE_VERSION}" | grep -q '"version"'; then
              echo "Hex.pm lists threadline ${RELEASE_VERSION}"
              exit 0
            fi
            echo "waiting for Hex index... (${i}/36)"
            sleep 10
          done
          exit 1

  distribution-sync:
    name: Post-publish distribution sync
    runs-on: ubuntu-24.04
    # A second 36 x 10s (6 min) Hex-registry poll, then a doc edit and PR.
    timeout-minutes: 20
    needs: [release-ref, publish-hex]
    if: |
      always() &&
      needs.release-ref.result == 'success' &&
      needs.publish-hex.result == 'success' &&
      needs.release-ref.outputs.skip_distribution_sync != 'true' &&
      needs.release-ref.outputs.dry_run != 'true' &&
      (needs.publish-hex.outputs.published == 'true' || needs.publish-hex.outputs.skipped == 'true')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Wait for Hex registry before doc sync
        env:
          RELEASE_VERSION: ${{ needs.release-ref.outputs.release_version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "https://hex.pm/api/packages/threadline/releases/${RELEASE_VERSION}" | grep -q '"version"'; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Apply distribution doc sync
        env:
          RELEASE_VERSION: ${{ needs.release-ref.outputs.release_version }}
          RELEASE_TAG: ${{ needs.release-ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERIFIED_DATE="$(date -u +%Y-%m-%d)"
          ./bin/post-publish-distribution-sync \
            "${RELEASE_VERSION}" \
            "${RELEASE_TAG}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${VERIFIED_DATE}"

      - name: Create distribution sync PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release-ref.outputs.release_version }}
        run: |
          set -euo pipefail
          BRANCH="release/sync-${RELEASE_VERSION}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/adoption-pilot-backlog.md
          # Idempotent: if the preflight already attests this version, there is
          # nothing to sync — skip the branch/PR instead of failing on an empty commit.
          if git diff --cached --quiet; then
            echo "Distribution docs already at ${RELEASE_VERSION}; nothing to sync."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "chore(release): sync distribution docs for ${RELEASE_VERSION}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(release): sync distribution docs for ${RELEASE_VERSION}" \
            --body "Automated post-publish distribution sync from Release workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.

          Merge after \`mix verify.doc_contract\` passes on this PR."
