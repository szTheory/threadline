services:
  postgres:
    image: postgres:16
    ports:
      # Default to 5433 so host PostgreSQL can own 5432 (see DB_PORT in config/test.exs).
      - "${THREADLINE_DB_HOST:-127.0.0.1}:${THREADLINE_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: threadline_test
      # Lets PgBouncer reach Postgres on the Docker network without SCRAM friction in dev/CI.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threadline_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: examples/threadline_phoenix/Dockerfile
      args:
        THREADLINE_DEMO_BASE_IMAGE: ${THREADLINE_DEMO_BASE_IMAGE:-elixir:1.18-otp-27-slim}
    ports:
      - "${THREADLINE_DEMO_HOST:-127.0.0.1}:${THREADLINE_DEMO_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - PORT=4000
      - PHX_SERVER=true
      - THREADLINE_DEMO_PORT=${THREADLINE_DEMO_PORT:-4000}
      - THREADLINE_DEMO_PUBLIC_HOST=${THREADLINE_DEMO_PUBLIC_HOST:-localhost}
      - THREADLINE_DEMO_PUBLIC_URL=${THREADLINE_DEMO_PUBLIC_URL:-}
    labels:
      - "dev.threadline.kind=demo"
      - "dev.threadline.managed-by=bin/demo-up"
      - "dev.threadline.root=${THREADLINE_CHECKOUT_ROOT:-}"
      - "dev.threadline.url=${THREADLINE_DEMO_URL:-}"
      - "dev.threadline.fallback-url=${THREADLINE_DEMO_FALLBACK_URL:-}"
      - "dev.threadline.proxy-host=${THREADLINE_PROXY_HOST:-}"
      - "dev.threadline.proxy-network=${THREADLINE_PROXY_NETWORK:-}"
      - "dev.threadline.version=v1.35"
    volumes:
      - .:/app
      - demo_example_deps:/app/examples/threadline_phoenix/deps
      - demo_example_build:/app/examples/threadline_phoenix/_build
      - demo_root_deps:/app/deps
      - demo_root_build:/app/_build

  pgbouncer:
    profiles: ["pgbouncer"]
    image: edoburu/pgbouncer:v1.25.1-p0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/threadline_test
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 5
    ports:
      - "${THREADLINE_PGBOUNCER_HOST:-127.0.0.1}:${THREADLINE_PGBOUNCER_PORT:-6432}:5432"

volumes:
  demo_example_deps:
  demo_example_build:
  demo_root_deps:
  demo_root_build:
